# Vector-RAG — a probe manifest to test what the current schema can express.
#
# App under test: a web app that ingests user text or documents, vectorizes them,
# then allows vector search over them + RAG (retrieval-augmented generation).
#
# Single subdomain split:
#   * corpus — Document + Chunk aggregates, their repositories, a pure chunking
#              service, the ingest/search/ask use cases.
#   * ai     — the external-provider capability ports (embed / generate / extract)
#              and their scaffolded SDK adapters + settings.
#
# No auth was described, so every endpoint is `anonymous`.
#
# >>> This probe drove the storage redesign + naming/streaming follow-ups. Most original
#     BLOCKERs are now DISSOLVED: the two "hard" ones (pgvector column + similarity index)
#     dissolved because Chunk persists in Qdrant (no SQLAlchemy table at all); the embedding-
#     dimension and streaming "soft" ones were modelling/expressibility, now resolved. Still
#     deferred (marked `# DEFERRED:` below): per-hit similarity score (nested read-model) and
#     multipart file upload.

meta:
  epic: 02-vector-rag
  name: "Vector-RAG — ingest, vectorize, vector-search, RAG"
  sources: []

domain:

  value_objects:
    # An embedding is a vector. Kept as a VO for TYPE-significance (an Embedding is not a
    # bare list[float] — it flows through embed/search/store), but with NO invariant: the
    # dimension is a DEPLOYMENT constant (it depends on the model, lives in OpenaiSettings),
    # and a pure domain VO must not depend on runtime config (hexagon). Dimension consistency
    # is enforced where it belongs — the embedder adapter produces the configured dimension
    # and the Qdrant collection is created for it. (Former soft-BLOCKER: dissolved by layering,
    # not a tooling gap — a config-dependent constraint was never a domain invariant.)
    - name: Embedding
      subdomain: corpus
      fields:
        - {name: vector, type: "list[float]"}
      sources: []

  entities:
    - name: Document
      subdomain: corpus
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: content, type: str}        # the raw source text (post-extraction)
      invariants: []
      sources: []

    - name: Chunk
      subdomain: corpus
      fields:
        - {name: id, type: UUID}
        - {name: document_id, type: UUID}
        - {name: position, type: int}        # ordinal within the document
        - {name: text, type: str}
        - {name: embedding, type: Embedding}
        # (Former hard BLOCKER #1 — pgvector column type — DISSOLVED: Chunk persists in the
        # `vectors` (Qdrant) store, so there is no SQLAlchemy table and no Python→SQL type map
        # to choke on; the embedding vector lives in the Qdrant collection.)
      invariants: []
      sources: []

  services:
    - name: ChunkingService              # pure: split source text into chunk strings
      subdomain: corpus
      kind: pure
      dependencies: []
      methods:
        - signature: "def split(self, text: str) -> list[str]"
          behaviour:
            - given: "a long source text"
              when: split
              then: {returns: "list[str]"}
              source: spec
          notes: |
            Split text into overlapping windows (size/overlap are body constants).
            Returns the ordered list of chunk strings; empty input -> empty list.
      notes: "Stateless text splitter; holds no state and calls no port."
      sources: []

  repository_protocols:
    - name: IDocumentRepository
      subdomain: corpus
      aggregate: Document
      methods:
        - "async def add(self, document: Document) -> None"
        - "async def get_by_id(self, document_id: UUID) -> Document"
        - "async def delete(self, document_id: UUID) -> None"
        - "async def list(self) -> tuple[tuple[Document, ...], int]"
      raises: [NotFoundError]
      sources: []

    - name: IChunkRepository
      subdomain: corpus
      aggregate: Chunk
      methods:
        - "async def add_many(self, chunks: tuple[Chunk, ...]) -> None"
        - "async def delete_by_document(self, document_id: UUID) -> None"
        - signature: "async def search(self, query_embedding: Embedding, k: int) -> tuple[Chunk, ...]"
          notes: "Return the k nearest chunks to query_embedding by cosine distance, closest first."
          # (Former hard BLOCKER #2 — similarity index — DISSOLVED: the index lives in the
          # Qdrant collection (HNSW), not a SQLAlchemy table. The fake repo's `search` is now a
          # write-once SCAFFOLD the implementer fills, not a generator crash.)
      raises: []
      sources: []

  capability_protocols:
    - name: ICanEmbedText
      subdomain: ai
      methods:
        - signature: "async def embed(self, texts: list[str]) -> list[Embedding]"
          notes: "Map each input string to its embedding vector, preserving order."
      sources: []
      notes: "A stateless text->vector encoder backed by an external embedding model."

    - name: ICanGenerateAnswer
      subdomain: ai
      methods:
        # Streaming is expressible: the signature is transcribed verbatim, so an
        # AsyncIterator[str] return models a token stream (the adapter yields chunks).
        - signature: "async def generate(self, question: str, context: list[str]) -> AsyncIterator[str]"
          notes: "Stream the answer token-by-token, grounded ONLY in the provided context passages."
      sources: []
      notes: "A stateless RAG generator backed by an external LLM (streams tokens)."

    - name: ICanExtractText
      subdomain: ai
      methods:
        - signature: "def extract(self, content: bytes, content_type: str) -> str"
          notes: "Extract plain text from an uploaded document (pdf/docx/txt)."
      sources: []
      notes: "Parses an uploaded file's bytes into plain text for chunking."

  exceptions:
    - {name: NotFoundError, code: NOT_FOUND, http_status: 404, sources: []}
    - {name: ValidationError, code: VALIDATION_ERROR, http_status: 422, sources: []}
    - {name: ProviderError, code: PROVIDER_ERROR, http_status: 502, sources: []}

application:

  commands:
    - name: IngestText
      input:
        - {name: title, type: str}
        - {name: text, type: str}
      output: "UUID"
      handler: {dependencies: [IDocumentRepository, IChunkRepository, ICanEmbedText, ChunkingService]}
      log_event: document_ingested
      notes: |
        Create a Document from (title, text); ChunkingService.split the text;
        ICanEmbedText.embed the chunks; build Chunk entities (position, text,
        embedding); persist the document then add_many the chunks. Return the
        document id.
      behaviour:
        - given: "a valid title and text"
          when: execute
          act: {title: "Onboarding guide", text: "Step one ... step two ..."}
          then: {persists: Document}
          source: spec
        - given: "a valid title and text"
          when: execute
          then: {calls: "ICanEmbedText.embed"}
          source: spec
      sources: []

    - name: IngestDocument
      input:
        - {name: title, type: str}
        - {name: content, type: bytes}
        - {name: content_type, type: str}
      output: "UUID"
      handler:
        dependencies: [IDocumentRepository, IChunkRepository, ICanEmbedText, ICanExtractText, ChunkingService]
      log_event: document_ingested
      notes: |
        ICanExtractText.extract the bytes to plain text, then proceed exactly like
        IngestText (chunk -> embed -> persist document + chunks).
      behaviour:
        - given: "a supported uploaded file"
          when: execute
          then: {calls: "ICanExtractText.extract"}
          source: spec
      sources: []

    - name: DeleteDocument
      input:
        - {name: document_id, type: UUID}
      output: "None"
      handler: {dependencies: [IDocumentRepository, IChunkRepository]}
      log_event: document_deleted
      raises: [NotFoundError]
      notes: "Delete the document (NotFoundError if absent) and all its chunks."
      behaviour:
        - given: "an existing document"
          when: execute
          arrange: [{entity: Document, fields: {id: "11111111-1111-1111-1111-111111111111"}}]
          act: {document_id: "11111111-1111-1111-1111-111111111111"}
          then: {deletes: Document}
          source: spec
        - given: "no document with the id"
          when: execute
          act: {document_id: "22222222-2222-2222-2222-222222222222"}
          then: {raises: NotFoundError}
          source: spec
      sources: []

  queries:
    - name: VectorSearch
      input:
        - {name: query, type: str}
        - {name: k, type: int, default: "5"}
      output: SearchResult
      result_fields:
        - {name: items, type: "tuple[SearchHit, ...]"}   # each hit carries its score (#3 resolved)
      result_dtos:
        # Nested read-model DTO: a search hit = the chunk + its similarity score. Lives beside
        # SearchResult in application/corpus/; SearchResult references it as a sibling.
        - name: SearchHit
          fields:
            - {name: chunk, type: Chunk}
            - {name: score, type: float}
      handler: {dependencies: [IChunkRepository, ICanEmbedText]}
      notes: |
        Embed the query (ICanEmbedText.embed -> first vector), then
        IChunkRepository.search(query_embedding, k); wrap the hits in SearchResult.
      behaviour:
        - given: "chunks exist in the corpus"
          when: execute
          then: {returns: SearchResult}
          source: spec
      sources: []

    - name: AskRag
      input:
        - {name: question, type: str}
        - {name: k, type: int, default: "5"}
      # Streaming RAG: the handler returns a token stream (no *Result DTO). A free output
      # type expression — the generator resolves its tokens (AsyncIterator) generically.
      output: "AsyncIterator[str]"
      handler: {dependencies: [IChunkRepository, ICanEmbedText, ICanGenerateAnswer]}
      notes: |
        Embed the question, retrieve the k nearest chunks, then stream
        ICanGenerateAnswer.generate(question, [c.text for c in hits]) straight through.
        (Returning the source chunks alongside the stream is the nested read-model gap,
        deferred — see #3.)
      behaviour:
        - given: "relevant chunks exist for the question"
          when: execute
          then: {calls: "ICanGenerateAnswer.generate"}
          source: spec
      sources: []

infrastructure:

  settings:
    # One settings per PROVIDER, not per capability: the embedder and the LLM are both
    # OpenAI, so they share one credential + one env prefix (VRAG_OPENAI_API_KEY set once).
    # Each capability reads its own model field. (Two capabilities → one settings is wired
    # by the generator into a single provider injected into both adapters.)
    # No `subpackage` — derived from the consuming tech (openai caps → infra/openai/,
    # the qdrant datastore → infra/qdrant/).
    - name: OpenaiSettings
      env_prefix: VRAG_OPENAI_
      fields:
        - {name: api_key, type: SecretStr, secret: true}
        - {name: embedding_model, type: str, default: '"text-embedding-3-small"'}
        - {name: embedding_dimension, type: int, default: "1536"}
        - {name: chat_model, type: str, default: '"gpt-4o-mini"'}
      sources: []
    - name: QdrantSettings
      env_prefix: VRAG_QDRANT_
      fields:
        - {name: url, type: str, default: '"http://localhost:6333"'}
        - {name: api_key, type: SecretStr, secret: true}
        - {name: collection, type: str, default: '"chunks"'}
      sources: []
    # Postgres connection settings as an ordinary node (the `main` store references it; the
    # engine bootstrap builds the async DSN from these fields). No hardcoded DbSettings.
    - name: DbSettings
      env_prefix: VRAG_DB_
      fields:
        - {name: host, type: str, default: '"localhost"'}
        - {name: port, type: int, default: "5432"}
        - {name: user, type: str, default: '"postgres"'}
        - {name: password, type: SecretStr, secret: true}
        - {name: name, type: str, default: '"vrag"'}
      sources: []

  datastores:
    # Polyglot persistence: relational metadata in Postgres, embeddings in a vector store.
    # The Postgres profile supplies bootstrap DbSettings; the Qdrant store names its own
    # connection settings + driver package. Each repository targets one store via `store`.
    - name: main
      kind: postgres
      settings: DbSettings
      sources: []
    - name: vectors
      kind: qdrant
      settings: QdrantSettings
      requires_packages: ["qdrant-client>=1.9"]
      sources: []

  capabilities:
    - implements: ICanEmbedText
      adapter: openai
      role: TextEmbedder       # → OpenaiTextEmbedder
      settings: OpenaiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai client (settings.embedding_model). embed: POST embeddings for the batch of
        texts; map each response vector to Embedding; preserve order. Map provider/HTTP
        errors -> ProviderError.
      sources: []
    - implements: ICanGenerateAnswer
      adapter: openai
      role: AnswerGenerator    # → OpenaiAnswerGenerator
      settings: OpenaiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        Chat completion (settings.chat_model): system prompt instructs grounding in the
        context passages only; user message = question + context. Map provider errors ->
        ProviderError.
      sources: []
    - implements: ICanExtractText
      adapter: unstructured
      role: TextExtractor      # → UnstructuredTextExtractor
      requires_packages: ["pypdf>=4.2", "python-docx>=1.1"]
      notes: |
        Dispatch on content_type: pdf -> pypdf, docx -> python-docx, text/* -> decode.
        Unsupported type -> ValidationError; corrupt file -> ProviderError.
      sources: []

  # No `tables:` block. Document (store: main = postgres) gets a write-once Table SCAFFOLD
  # the implementer fills (plain metadata columns). Chunk lives in the `vectors` (qdrant)
  # store → no SQLAlchemy table at all; its collection + the embedding vector + the HNSW/
  # IVFFlat similarity index belong to the qdrant profile (later increment), not a `Table`.
  # This dissolves former BLOCKER #1/#2: the vector store is no longer forced into Postgres.

  repositories:
    - implements: IDocumentRepository
      backs: Document
      store: main
      sources: []
    - implements: IChunkRepository
      backs: Chunk
      store: vectors
      notes: |
        Qdrant adapter over the configured collection. add_many: upsert points (id,
        vector=embedding.vector, payload={document_id, position, text}). search:
        client.search(collection, query_vector, limit=k) → nearest Chunks, closest first.
        delete_by_document: delete by a document_id payload filter. Map qdrant/SDK errors
        → ProviderError.
      sources: []

restapi:

  schemas:
    - name: IngestTextRequest
      resource: documents
      kind: request
      fields:
        - {name: title, type: str}
        - {name: text, type: str}
      sources: []
    - name: DocumentResponse
      resource: documents
      kind: response
      fields:
        - {name: id, type: UUID}
      sources: []

    - name: ChunkResponse
      resource: search
      kind: response
      fields:
        - {name: id, type: UUID}
        - {name: document_id, type: UUID}
        - {name: text, type: str}
      sources: []
    - name: ChunkHitResponse        # REST mirror of SearchHit: the chunk + its score
      resource: search
      kind: response
      fields:
        - {name: chunk, type: ChunkResponse}
        - {name: score, type: float}
      sources: []
    - name: SearchRequest
      resource: search
      kind: request
      fields:
        - {name: query, type: str}
        - {name: k, type: int}
      sources: []
    - name: SearchResponse
      resource: search
      kind: response
      fields:
        - {name: items, type: "Sequence[ChunkHitResponse]"}
      sources: []

    - name: AskRequest
      resource: rag
      kind: request
      fields:
        - {name: question, type: str}
        - {name: k, type: int}
      sources: []
    # No AnswerResponse schema — /ask streams (SSE), so there is no fixed JSON response body.

  endpoints:
    - method: POST
      path: /documents/text
      resource: documents
      auth: anonymous
      request: IngestTextRequest
      response: DocumentResponse
      handler: IngestText
      sources: []

    # Multipart upload (#4 resolved): request_kind=multipart → the generator derives the route
    # signature from IngestDocument's inputs — `content: bytes` → file: UploadFile = File(...),
    # the rest (title, content_type) → Form(...). No JSON request schema.
    - method: POST
      path: /documents
      resource: documents
      auth: anonymous
      request_kind: multipart
      response: DocumentResponse
      handler: IngestDocument
      sources: []

    - method: DELETE
      path: /documents/{document_id}
      resource: documents
      auth: anonymous
      handler: DeleteDocument
      sources: []

    - method: POST
      path: /search
      resource: search
      auth: anonymous
      request: SearchRequest
      response: SearchResponse
      status_code: 200               # search creates nothing; override POST->201
      handler: VectorSearch
      sources: []

    - method: POST
      path: /ask
      resource: rag
      auth: anonymous
      request: AskRequest
      # No `response` schema — this is a streaming endpoint. The scaffolded route body wraps
      # the handler's AsyncIterator[str] in a StreamingResponse (SSE); `notes` guides it.
      status_code: 200
      notes: "Stream the answer tokens as Server-Sent Events (StreamingResponse over the handler's AsyncIterator)."
      handler: AskRag
      sources: []

tests:
  architecture_rules:
    - name: test_no_print_outside_entrypoints
      pattern: '\bprint\('
      paths: [domain/, application/, infrastructure/]
      allow_list: []
      sources: []
