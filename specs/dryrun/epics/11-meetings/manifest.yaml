# Epic 11 — Meetings (upload → AI pipeline → browse/search).
#
# Bounded context: Meetings alone (approved). Owns the Meeting + ActionItem aggregates, the
# MeetingStatus + ActionItemStatus enums, the AI capabilities, and POLYGLOT persistence:
# Postgres `main` (meetings + action items + the blob key) and Qdrant `vectors` (transcript
# embeddings for semantic search). Separate context from Accounts (epic 10): they do not change
# together. Scaffolded into the SAME package (model A) — shared substrate (exceptions, Postgres
# bootstrap, DbSettings, containers, main.py) emitted once from the union of the two contexts.
#
# CROSS-EPIC EDGES into Accounts (epic 10), resolved at scaffold time (validate with --app):
#   * QuotaPolicy.dependencies → accounts:IWorkspaceRepository (reads the workspace's plan tier).
#   * QuotaPolicy body references accounts:PlanTier (the plan→limit mapping) and the accounts:Workspace
#     it returns — type references carried in `notes`, not edges.
#   * Every meeting endpoint is `authenticated` → binds accounts' get_current_user / token verify;
#     created_by + workspace_id are stamped from the CurrentUser the token carries (spec §5).
#
# Architecture decisions folded in (the parked epic.md questions):
#   * Processing is SYNCHRONOUS (v1) — one POST /meetings/{id}/process endpoint. Async is a future UC.
#   * Two-store partial failure (Postgres + Qdrant, no distributed tx): on ANY pipeline failure mark
#     the meeting FAILED and raise; a retry may re-index. Accepted (UC-13 Description).
#   * MeetingStatus is a FREE StrEnum (UPLOADED/PROCESSING/READY/FAILED), no guarded transition table
#     (flexibility wanted, UC-13). ActionItemStatus carries only OPEN now; DONE is the UC-16 delta.
#   * Embedding = the whole transcript as one vector (v1); chunking is a refinement (ML).
#   * Over-quota → 402 (billing/upgrade signal, UC-12 Q2). ProcessingError → 502 (upstream AI failed).
#   * ProcessMeeting is a COMMAND returning the meeting id (CQRS); the READY view is read via UC-14.
#   * Read-model note: created_at (a DB-managed audit column) is used to SORT the library (repository
#     order_by on the column) but is NOT projected into a response body in v1 — see the dry-run
#     feedback log (the read-model-with-audit-columns placement is the surfaced rough edge).

meta:
  epic: 11-meetings
  name: "Meetings — upload, AI summary + action items, browse, semantic search"
  sources:
    - "specs/dryrun/use-cases/UC-12-upload-recording.md"
    - "specs/dryrun/use-cases/UC-13-process-recording.md"
    - "specs/dryrun/use-cases/UC-14-browse-meetings.md"
    - "specs/dryrun/use-cases/UC-15-search-meetings.md"
    # DELTA (brownfield, applied after the base build):
    - "specs/dryrun/use-cases/UC-16-complete-action-item.md"   # D1: ActionItemStatus grows DONE; the
        # action-item repo grows get_by_id+update (drift on the filled action_item_repository body); a new
        # CompleteActionItem command + endpoint. Product TBDs resolved (BA): complete is IDEMPOTENT
        # (already-DONE → success), ANY workspace member may complete, no un-complete (out of scope).
    - "specs/dryrun/use-cases/UC-17-export-summary-pdf.md"     # D2: a new ICanRenderPdf capability +
        # reportlab adapter; an ExportMeeting query returning PDF bytes; a streaming-download endpoint.
        # Product TBDs resolved (BA): unbranded PDF, summary + action items but NOT the transcript,
        # not-READY → 422 ValidationError.

domain:

  enums:
    - name: MeetingStatus
      subdomain: meetings
      base: StrEnum
      members:
        - {name: UPLOADED, value: UPLOADED}
        - {name: PROCESSING, value: PROCESSING}
        - {name: READY, value: READY}
        - {name: FAILED, value: FAILED}
      # Free enum, no guarded transition method (the approved decision). Transitions live in the
      # ProcessMeeting body, pinned by `then.with` in its behaviour.
      sources: ["UC-13"]

    - name: ActionItemStatus
      subdomain: meetings
      base: StrEnum
      members:
        - {name: OPEN, value: OPEN}
        - {name: DONE, value: DONE}     # DELTA UC-16 — the OPEN→DONE transition (CompleteActionItem).
      sources: ["UC-13", "UC-16"]

  value_objects:
    - name: Title
      subdomain: meetings
      fields:
        - {name: value, type: str}
      invariants:
        - rule: "3–200 characters inclusive, measured AFTER trimming surrounding whitespace; the stored value is the trimmed form"
          field: value
          source: spec
      sources: ["UC-12"]

    - name: SearchQuery
      subdomain: meetings
      # Transient search input modeled as a VO so the non-empty rule is a STRUCTURAL pre-flight gate
      # (constructing it from a blank query fails before anything is embedded — UC-15 A3).
      fields:
        - {name: value, type: str}
      invariants:
        - rule: "non-empty AFTER trimming surrounding whitespace (do not embed an empty query)"
          field: value
          source: spec
      sources: ["UC-15"]

    - name: SummaryDraft           # the summarization capability's structured output (one round-trip)
      subdomain: meetings
      frozen: true
      fields:
        - {name: summary, type: str}
        - {name: action_item_titles, type: "tuple[str, ...]"}
      sources: ["UC-13"]

    - name: SearchHit              # one vector-search result: a meeting id + its similarity score
      subdomain: meetings
      frozen: true
      fields:
        - {name: meeting_id, type: UUID}
        - {name: score, type: float}
      sources: ["UC-15"]

    - name: QuotaTunable           # tunable VO: per-tier monthly meeting limits, from QuotaSettings at DI
      subdomain: meetings
      fields:
        - {name: free_monthly_meetings, type: int}
        - {name: pro_monthly_meetings, type: int}
        - {name: enterprise_monthly_meetings, type: int}
      sources: ["UC-12"]

    - name: SearchTunable          # tunable VO: top-k + min similarity, from SearchSettings at DI
      subdomain: meetings
      fields:
        - {name: top_k, type: int}
        - {name: min_score, type: float}
      sources: ["UC-15"]

  entities:
    - name: Meeting
      subdomain: meetings
      fields:
        # non-default fields first, then defaulted ones (a valid @dataclass order — field_order gate).
        - {name: id, type: UUID}
        - {name: workspace_id, type: UUID}     # the tenant (from the uploader's token)
        - {name: title, type: Title}
        - {name: blob_key, type: str}          # the storage key of the raw audio
        - {name: created_by, type: UUID}        # the uploader (caller_id, from auth)
        - {name: status, type: MeetingStatus, default: "MeetingStatus.UPLOADED"}
        - {name: summary, type: "str | None", optional: true, default: "None"}      # set by processing
        - {name: transcript, type: "str | None", optional: true, default: "None"}   # set by processing
      invariants: []
      sources: ["UC-12", "UC-13"]

    - name: ActionItem
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: meeting_id, type: UUID}        # the meeting it was extracted from
        - {name: title, type: str}              # free text from the LLM (no 3–200 rule — not a meeting title)
        - {name: status, type: ActionItemStatus, default: "ActionItemStatus.OPEN"}
      invariants: []
      sources: ["UC-13"]

  services:
    - name: QuotaPolicy            # the cross-epic monthly-quota gate (A1 of UC-12)
      subdomain: meetings
      dependencies: [IMeetingRepository, "accounts:IWorkspaceRepository", QuotaTunable]   # cross-epic edge → epic 10
      methods:
        - signature: "async def assert_within_quota(self, workspace_id: UUID) -> None"
          raises: [QuotaExceededError]
          behaviour:                # cross-epic dependency → manual stub
            - given: "a workspace under its plan's monthly meeting limit"
              when: assert_within_quota
              then: {returns: None}
              source: spec
            - given: "a workspace at or over its plan's monthly meeting limit"
              when: assert_within_quota
              then: {raises: QuotaExceededError}    # A1 — billing/upgrade signal (402)
              source: spec
          notes: |
            Read the workspace via the injected accounts:IWorkspaceRepository.get_by_id(workspace_id)
            to get its accounts:PlanTier. Pick the monthly limit from the injected QuotaTunable by
            tier (FREE → free_monthly_meetings, PRO → pro_monthly_meetings, ENTERPRISE →
            enterprise_monthly_meetings). Count this workspace's meetings created since the start of
            the current calendar month (UTC) via IMeetingRepository.count_created_since(workspace_id,
            month_start). If the count is at or over the limit, raise QuotaExceededError; otherwise
            return None. Quota is by meeting COUNT per month (v1, UC-12 Q1). Limits come ONLY from the
            injected QuotaTunable, never hard-coded.
      notes: |
        The only place that crosses into the Accounts context. Stateless apart from its injected
        dependencies. Encapsulates the A1 quota rule a thin handler must not carry.
      sources: ["UC-12"]

  repository_protocols:
    - name: IMeetingRepository
      subdomain: meetings
      aggregate: Meeting
      methods:
        - signature: "async def add(self, meeting: Meeting) -> None"
          notes: "Insert the new meeting row (status UPLOADED). A duplicate id is an integrity error, not an expected path."
        - signature: "async def get_by_id(self, meeting_id: UUID, workspace_id: UUID) -> Meeting | None"
          notes: "Tenant-scoped lookup — match BOTH id and workspace_id so a cross-tenant id reads as None (== not found). Return None when absent."
        - signature: "async def update(self, meeting: Meeting) -> None"
          notes: "Persist the status transition + summary/transcript (PROCESSING/READY/FAILED). Used by the processing pipeline."
        - signature: "async def list(self, workspace_id: UUID, filter: MeetingFilter) -> tuple[Meeting, ...]"
          notes: "Tenant-scoped, filtered, sorted, paginated list per the MeetingFilter (status set, created-date range, sort key, page/size). Sort by the DB-managed created_at column for the CREATED_AT key."
        - signature: "async def count(self, workspace_id: UUID, filter: MeetingFilter) -> int"
          notes: "Total matching count for the same filter (pagination ignored) — for the library pager total."
        - signature: "async def count_created_since(self, workspace_id: UUID, since: datetime) -> int"
          notes: "Count this workspace's meetings created on/after `since` (the quota check's monthly count). Uses the DB-managed created_at column."
      sources: ["UC-12", "UC-13", "UC-14"]

    - name: IActionItemRepository
      subdomain: meetings
      aggregate: ActionItem
      methods:
        - signature: "async def add_many(self, items: tuple[ActionItem, ...]) -> None"
          notes: "Bulk-insert the action items extracted for a meeting (status OPEN). May be empty (no action items) — then it is a no-op."
        - signature: "async def list_for_meeting(self, meeting_id: UUID) -> tuple[ActionItem, ...]"
          notes: "All action items for one meeting (the detail view, UC-14). Ordered by insertion is fine."
        # DELTA UC-16 — the create-only repo grows a fetch-by-id + an update. These two methods are the
        # contract DRIFT: the already-filled action_item_repository.py body (add_many + list_for_meeting)
        # is now missing them → the runner's drift trigger wakes the implementer to reconcile.
        - signature: "async def get_by_id(self, action_item_id: UUID) -> ActionItem | None"
          notes: "Lookup one action item by id; return None when absent. The caller confirms tenant scope via the parent meeting (UC-16)."
        - signature: "async def update(self, item: ActionItem) -> None"
          notes: "Persist the status change (OPEN→DONE) by id."
      sources: ["UC-13", "UC-14", "UC-16"]

    - name: IMeetingSearchIndex    # the vector-store side of Meeting (polyglot: Qdrant, not Postgres)
      subdomain: meetings
      aggregate: Meeting
      methods:
        - signature: "async def index(self, meeting_id: UUID, workspace_id: UUID, embedding: tuple[float, ...]) -> None"
          notes: "Upsert the meeting's transcript embedding into the workspace-scoped vector collection (the workspace_id is stored as a payload filter so search never crosses tenants)."
        - signature: "async def search(self, workspace_id: UUID, embedding: tuple[float, ...], top_k: int) -> tuple[SearchHit, ...]"
          notes: "Vector-similarity search within the workspace's entries; return up to top_k SearchHit (meeting_id + score), ranked best-first. Tenant-scoped by the workspace_id payload filter."
      sources: ["UC-13", "UC-15"]

  capability_protocols:
    - name: ICanStoreBlobs         # object storage for the raw audio (S3-compatible)
      subdomain: meetings
      methods:
        - signature: "async def store(self, key_hint: str, content_type: str, data: bytes) -> str"
          notes: "Upload the bytes; return the storage key (the implementation may derive a unique key from key_hint). The returned key is what the meeting row persists."
        - signature: "async def fetch(self, key: str) -> bytes"
          notes: "Download the bytes for a stored key (the processing pipeline reads the audio back)."
        - signature: "async def delete(self, key: str) -> None"
          notes: "Delete a stored blob — the compensating step when the DB write fails after an upload (UC-12 A3)."
      notes: "A stateless object-storage gateway. SDK-specific error translation lives on the adapter, not here."
      sources: ["UC-12", "UC-13"]

    - name: ICanTranscribeAudio
      subdomain: meetings
      methods:
        - signature: "async def transcribe(self, audio: bytes) -> str"
          notes: "Transcribe the audio to text. May return an empty string for silent/corrupt audio — the caller treats empty as a processing failure (UC-13 Q5)."
      notes: "A stateless speech-to-text gateway (Whisper-class). Upstream/SDK errors are translated to a domain ProcessingError on the adapter."
      sources: ["UC-13"]

    - name: ICanSummarizeMeeting
      subdomain: meetings
      methods:
        - signature: "async def summarize(self, transcript: str) -> SummaryDraft"
          notes: "One LLM round-trip returning BOTH the prose summary and the list of extracted action-item titles (a SummaryDraft)."
      notes: "A stateless summarization gateway (LLM). Returns a structured SummaryDraft so summary + action items come from a single call. SDK errors → ProcessingError on the adapter."
      sources: ["UC-13"]

    - name: ICanEmbedText
      subdomain: meetings
      methods:
        - signature: "async def embed(self, text: str) -> tuple[float, ...]"
          notes: "Embed text into a single dense vector. Used for both the transcript (at processing) and the search query (at search time) so they share a vector space."
      notes: "A stateless embedding gateway. SDK errors → ProcessingError on the adapter."
      sources: ["UC-13", "UC-15"]

    - name: ICanRenderPdf            # DELTA UC-17 — render a meeting summary document to PDF bytes
      subdomain: meetings
      methods:
        - signature: "async def render(self, title: str, summary: str, action_items: tuple[str, ...]) -> bytes"
          notes: "Render a self-contained PDF: the meeting title, the summary prose, then the action-item lines (each already formatted by the handler as e.g. '[x] Title' / '[ ] Title'). Return the raw PDF bytes. Unbranded layout for v1; the transcript is NOT included."
      notes: "A stateless document renderer. The PDF library is swappable behind this port; SDK/library errors are translated to a domain error on the adapter."
      sources: ["UC-17"]

  exceptions:
    # ValidationError + NotFoundError are ALSO declared by epic 10 — when both contexts are scaffolded
    # into one package the catalog is the UNION, deduped by name (conventions block F).
    - {name: ValidationError, code: VALIDATION_ERROR, http_status: 422, sources: ["UC-12", "UC-13", "UC-15"]}
    - {name: NotFoundError, code: NOT_FOUND, http_status: 404, sources: ["UC-13", "UC-14"]}
    - {name: QuotaExceededError, code: QUOTA_EXCEEDED, http_status: 402, sources: ["UC-12"]}      # A1, billing/upgrade
    - {name: ProcessingError, code: PROCESSING_FAILED, http_status: 502, sources: ["UC-13"]}      # A3, upstream AI failed

  filters:
    - name: MeetingFilter
      subdomain: meetings
      fields:
        - {name: status, type: "frozenset[MeetingStatus]", default: "frozenset()"}   # multi-valued; empty = all
        - {name: created_after, type: "datetime | None", optional: true, default: "None"}
        - {name: created_before, type: "datetime | None", optional: true, default: "None"}
      pagination: true              # adds the page/size fields the repository's list applies (default size 20)
      sort:
        enum_name: MeetingSort
        keys: [CREATED_AT, TITLE]
        default: CREATED_AT         # newest-first is the repository body's default direction for this key
      sources: ["UC-14"]

application:

  commands:
    - name: UploadRecording
      # caller_id + workspace_id are stamped from the authenticated CurrentUser by the endpoint, never
      # the request body (the reporter-stamp / tenant-scope rule). audio + content_type come from the
      # multipart upload.
      input:
        - {name: caller_id, type: UUID}
        - {name: workspace_id, type: UUID}
        - {name: title, type: Title}
        - {name: audio, type: bytes}
        - {name: content_type, type: str}
      output: UUID                  # the new meeting id
      log_event: meeting_uploaded
      handler: {dependencies: [IMeetingRepository, ICanStoreBlobs, QuotaPolicy]}
      raises: [QuotaExceededError]
      behaviour:                    # multi-dependency + compensating-tx → manual stub
        - given: "a valid upload for a workspace under its monthly quota"
          when: execute
          then: {persists: Meeting, with: {status: UPLOADED}}
          source: spec
        - given: "a workspace at or over its monthly quota"
          when: execute
          then: {raises: QuotaExceededError}    # A1 — no blob stored, no row
          source: spec
        - given: "the database insert fails after the blob has been uploaded"
          when: execute
          then: {calls: "ICanStoreBlobs.delete"}   # A3 — compensating delete, then the error re-raises
          source: spec
      notes: |
        Thin orchestration with the ONE sanctioned try/except (compensating-tx, see
        pattern-compensating-tx):
        1. await QuotaPolicy.assert_within_quota(cmd.workspace_id) — raises QuotaExceededError if the
           workspace is over its plan's monthly meeting limit (nothing is stored on that path).
        2. blob_key = await ICanStoreBlobs.store(<key hint>, cmd.content_type, cmd.audio).
        3. Build Meeting(id=uuid7, workspace_id=cmd.workspace_id, title=cmd.title, blob_key=blob_key,
           status=MeetingStatus.UPLOADED, created_by=cmd.caller_id, summary=None, transcript=None).
        4. try: await IMeetingRepository.add(meeting); except: await ICanStoreBlobs.delete(blob_key);
           raise — so a DB failure never leaks an orphan blob (UC-12 A3). This is the only try/except.
        5. log meeting_uploaded (meeting_id, caller_id); return meeting.id.
      sources: ["UC-12"]

    - name: ProcessMeeting
      # The synchronous AI pipeline. A COMMAND (it mutates) returning the meeting id; the READY view is
      # read back via UC-14. workspace_id scopes the load; caller_id is carried for logging.
      input:
        - {name: caller_id, type: UUID}
        - {name: workspace_id, type: UUID}
        - {name: meeting_id, type: UUID}
      output: UUID
      log_event: meeting_processed
      handler:
        dependencies:
          - IMeetingRepository
          - ICanStoreBlobs
          - ICanTranscribeAudio
          - ICanSummarizeMeeting
          - ICanEmbedText
          - IMeetingSearchIndex
          - IActionItemRepository
      raises: [NotFoundError, ValidationError, ProcessingError]
      behaviour:                    # many dependencies + two-store + state machine → manual stub
        - given: "an UPLOADED meeting in the caller's workspace processes successfully"
          when: execute
          then: {persists: Meeting, with: {status: READY}}
          source: spec
        - given: "a meeting that is already READY"
          when: execute
          then: {raises: ValidationError}       # A2 — only UPLOADED or FAILED may be processed
          source: spec
        - given: "a meeting id that does not exist or is in another workspace"
          when: execute
          then: {raises: NotFoundError}         # A1 — cross-tenant == not found
          source: spec
        - given: "a meeting whose transcription/summary/embedding step fails (or returns empty audio)"
          when: execute
          then: {persists: Meeting, with: {status: FAILED}, raises: ProcessingError}   # A3/A4
          source: spec
      notes: |
        Synchronous pipeline (v1). Two-store, NO distributed transaction — on any failure mark FAILED
        and raise (a retry may re-index, accepted UC-13):
        1. meeting = await IMeetingRepository.get_by_id(cmd.meeting_id, cmd.workspace_id); if None
           raise NotFoundError. If meeting.status is READY raise ValidationError ("already processed");
           only UPLOADED or FAILED may proceed (UC-13 Q4).
        2. Set status PROCESSING (optional persist) then run the pipeline inside a guard so any failure
           marks FAILED: audio = await ICanStoreBlobs.fetch(meeting.blob_key); transcript = await
           ICanTranscribeAudio.transcribe(audio); if transcript is empty/whitespace treat as failure
           (UC-13 Q5 → FAILED + ProcessingError); draft = await ICanSummarizeMeeting.summarize(
           transcript); embedding = await ICanEmbedText.embed(transcript); await
           IMeetingSearchIndex.index(meeting.id, meeting.workspace_id, embedding).
        3. On success: set meeting.status = READY, meeting.summary = draft.summary, meeting.transcript
           = transcript; await IMeetingRepository.update(meeting); build one ActionItem(id=uuid7,
           meeting_id=meeting.id, title=t, status=OPEN) per title in draft.action_item_titles and
           await IActionItemRepository.add_many(items); log meeting_processed; return meeting.id.
        4. On ANY failure in step 2/3: set meeting.status = FAILED, await IMeetingRepository.update(
           meeting), then raise ProcessingError. The compensating concern across two stores is
           accepted as "FAILED on error, retry may re-index" (architect decision, UC-13).
      sources: ["UC-13"]

    - name: CompleteActionItem        # DELTA UC-16 — mark one action item DONE (OPEN→DONE)
      input:
        - {name: caller_id, type: UUID}
        - {name: workspace_id, type: UUID}
        - {name: action_item_id, type: UUID}
      output: UUID                     # the action item id
      log_event: action_item_completed
      handler: {dependencies: [IActionItemRepository, IMeetingRepository]}
      raises: [NotFoundError]
      behaviour:                       # multi-dep + tenant-scope via the parent meeting → manual stub
        - given: "an OPEN action item whose meeting is in the caller's workspace"
          when: execute
          then: {persists: ActionItem, with: {status: DONE}}
          source: spec
        - given: "an action item that is already DONE"
          when: execute
          then: {persists: ActionItem, with: {status: DONE}}    # A2 — idempotent (BA: success, no error)
          source: spec
        - given: "an action item id that does not exist, or whose meeting is in another workspace"
          when: execute
          then: {raises: NotFoundError}                          # A1 — cross-tenant == not found
          source: spec
      notes: |
        item = await IActionItemRepository.get_by_id(cmd.action_item_id); if None raise NotFoundError.
        Tenant-scope via the parent meeting: meeting = await IMeetingRepository.get_by_id(item.meeting_id,
        cmd.workspace_id); if None raise NotFoundError (the action item's meeting is not in the caller's
        workspace → indistinguishable from not-found). Set item.status = ActionItemStatus.DONE (idempotent
        — already-DONE stays DONE, no error per the BA decision); await IActionItemRepository.update(item);
        log action_item_completed (action_item_id, caller_id); return item.id.
      sources: ["UC-16"]

  queries:
    - name: BrowseMeetings
      # workspace_id from the token; the filter from the query string. Tenant-scoped library list.
      input:
        - {name: workspace_id, type: UUID}
        - {name: filter, type: MeetingFilter}
      output: BrowseMeetingsResult
      result_fields:
        - {name: items, type: "tuple[MeetingSummary, ...]"}
        - {name: total, type: int}
      result_dtos:
        - name: MeetingSummary
          fields:
            - {name: id, type: UUID}
            - {name: title, type: str}
            - {name: status, type: MeetingStatus}
            - {name: created_by, type: UUID}
      handler: {dependencies: [IMeetingRepository]}
      behaviour:                    # relational list + filter → manual stub
        - given: "meetings in the workspace matching the filter"
          when: execute
          then: {returns: BrowseMeetingsResult}
          source: spec
        - given: "a filter (or empty workspace) matching nothing"
          when: execute
          then: {returns: BrowseMeetingsResult}    # empty items, total 0 — not an error (UC-14 A1)
          source: spec
      notes: |
        meetings = await IMeetingRepository.list(query.workspace_id, query.filter); total = await
        IMeetingRepository.count(query.workspace_id, query.filter). Map each Meeting → MeetingSummary
        (id, title.value, status, created_by). Return BrowseMeetingsResult(items, total). Sort /
        pagination / filtering are the repository body's job per the filter (default sort newest-first,
        default page size 20). Tenant-scoped — workspace_id from the token, never a request param.
      sources: ["UC-14"]

    - name: GetMeeting
      input:
        - {name: workspace_id, type: UUID}
        - {name: meeting_id, type: UUID}
      output: MeetingDetail
      result_fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: MeetingStatus}
        - {name: summary, type: "str | None"}
        - {name: action_items, type: "tuple[ActionItemView, ...]"}
      result_dtos:
        - name: ActionItemView
          fields:
            - {name: id, type: UUID}
            - {name: title, type: str}
            - {name: status, type: ActionItemStatus}
      handler: {dependencies: [IMeetingRepository, IActionItemRepository]}
      raises: [NotFoundError]
      behaviour:                    # join (meeting + action items) → manual stub
        - given: "an existing meeting in the caller's workspace"
          when: execute
          then: {returns: MeetingDetail}
          source: spec
        - given: "a meeting id that does not exist or is in another workspace"
          when: execute
          then: {raises: NotFoundError}    # UC-14 A2 — cross-tenant == not found
          source: spec
      notes: |
        m = await IMeetingRepository.get_by_id(query.meeting_id, query.workspace_id); if None raise
        NotFoundError. items = await IActionItemRepository.list_for_meeting(m.id); map each →
        ActionItemView(id, title, status). Return MeetingDetail(id=m.id, title=m.title.value,
        status=m.status, summary=m.summary, action_items=...). Tenant-scoped.
      sources: ["UC-14"]

    - name: SearchMeetings
      input:
        - {name: workspace_id, type: UUID}
        - {name: query, type: SearchQuery}
      output: SearchMeetingsResult
      result_fields:
        - {name: items, type: "tuple[SearchResultItem, ...]"}
      result_dtos:
        - name: SearchResultItem
          fields:
            - {name: meeting_id, type: UUID}
            - {name: title, type: str}
            - {name: status, type: MeetingStatus}
            - {name: score, type: float}
      handler: {dependencies: [ICanEmbedText, IMeetingSearchIndex, IMeetingRepository, SearchTunable]}
      behaviour:                    # embedding + vector search + hydrate → manual stub
        - given: "a query matching indexed transcripts in the workspace"
          when: execute
          then: {returns: SearchMeetingsResult}
          source: spec
        - given: "a query with nothing similar (or no indexed meetings yet)"
          when: execute
          then: {returns: SearchMeetingsResult}    # empty items — not an error (UC-15 A1)
          source: spec
      notes: |
        vector = await ICanEmbedText.embed(query.query.value); hits = await
        IMeetingSearchIndex.search(query.workspace_id, vector, SearchTunable.top_k); keep only hits
        with score >= SearchTunable.min_score (drop weak matches — UC-15 Q7, quality over quantity);
        for each surviving hit, m = await IMeetingRepository.get_by_id(hit.meeting_id,
        query.workspace_id) — skip a hit whose row is gone (stale-index race, skip silently per the
        architect decision); map to SearchResultItem(meeting_id, title.value, status, score), ranked
        best-first (search already returns ranked). The empty-query gate is the SearchQuery VO at the
        endpoint, so the handler never sees a blank query. Tenant-scoped.
      sources: ["UC-15"]

    - name: ExportMeeting             # DELTA UC-17 — render a READY meeting's summary to a PDF (bytes)
      input:
        - {name: workspace_id, type: UUID}
        - {name: meeting_id, type: UUID}
      output: bytes                    # the raw PDF bytes (the endpoint streams them as a download)
      handler: {dependencies: [IMeetingRepository, IActionItemRepository, ICanRenderPdf]}
      raises: [NotFoundError, ValidationError]
      behaviour:                       # read + render → manual stub
        - given: "a READY meeting in the caller's workspace"
          when: execute
          then: {returns: bytes}
          source: spec
        - given: "a meeting that is not READY yet (UPLOADED/PROCESSING/FAILED)"
          when: execute
          then: {raises: ValidationError}     # A2 — nothing to export (BA: 422)
          source: spec
        - given: "a meeting id that does not exist or is in another workspace"
          when: execute
          then: {raises: NotFoundError}       # A1
          source: spec
      notes: |
        m = await IMeetingRepository.get_by_id(query.meeting_id, query.workspace_id); if None raise
        NotFoundError. If m.status is not MeetingStatus.READY raise ValidationError ("nothing to export
        yet"). items = await IActionItemRepository.list_for_meeting(m.id); format each into a line
        (e.g. "[x] <title>" when DONE else "[ ] <title>"); pdf = await ICanRenderPdf.render(m.title.value,
        m.summary or "", tuple(lines)); return pdf. Read-only (no mutation, no business-event log). The
        transcript is deliberately NOT included (BA decision).
      sources: ["UC-17"]

infrastructure:

  settings:
    - name: DbSettings             # shared with epic 10 — dedup into one class at scaffold (block F)
      env_prefix: MEETINGMIND_DB_
      fields:
        - {name: host, type: str, default: '"localhost"'}
        - {name: port, type: int, default: "5432"}
        - {name: user, type: str, default: '"postgres"'}
        - {name: password, type: SecretStr, secret: true}
        - {name: name, type: str, default: '"meetingmind"'}
      sources: ["UC-12"]

    - name: BlobSettings
      env_prefix: MEETINGMIND_BLOB_
      fields:
        - {name: bucket, type: str}
        - {name: endpoint_url, type: "str | None", default: "None"}   # for S3-compatible (MinIO) hosts
        - {name: access_key, type: SecretStr, secret: true}
        - {name: secret_key, type: SecretStr, secret: true}
        - {name: region, type: str, default: '"us-east-1"'}
      sources: ["UC-12"]

    - name: OpenaiSettings         # shared by all three openai capabilities (one settings per tech subpackage)
      env_prefix: MEETINGMIND_OPENAI_
      fields:
        - {name: api_key, type: SecretStr, secret: true}
        - {name: transcribe_model, type: str, default: '"whisper-1"'}
        - {name: summary_model, type: str, default: '"gpt-4o"'}
        - {name: embed_model, type: str, default: '"text-embedding-3-small"'}
      sources: ["UC-13"]

    - name: QdrantSettings
      env_prefix: MEETINGMIND_QDRANT_
      fields:
        - {name: url, type: str, default: '"http://localhost:6333"'}
        - {name: api_key, type: "SecretStr | None", secret: true, default: "None"}
        - {name: collection, type: str, default: '"meeting_transcripts"'}
      sources: ["UC-13", "UC-15"]

    - name: QuotaSettings          # → QuotaTunable (per-tier monthly meeting limits, UC-12 Q1)
      env_prefix: MEETINGMIND_QUOTA_
      fields:
        - {name: free_monthly_meetings, type: int, default: "10"}
        - {name: pro_monthly_meetings, type: int, default: "100"}
        - {name: enterprise_monthly_meetings, type: int, default: "1000"}
      sources: ["UC-12"]

    - name: SearchSettings         # → SearchTunable (top-k + min similarity, UC-15 Q7)
      env_prefix: MEETINGMIND_SEARCH_
      fields:
        - {name: top_k, type: int, default: "10"}
        - {name: min_score, type: float, default: "0.5"}
      sources: ["UC-15"]

  capabilities:
    - implements: ICanStoreBlobs
      adapter: s3
      role: BlobStore              # → S3BlobStore
      settings: BlobSettings
      requires_packages: ["boto3>=1.34"]
      notes: |
        boto3 S3 client (works against AWS S3 or MinIO via endpoint_url). store: put_object(Bucket=
        settings.bucket, Key=<derived key>, Body=data, ContentType=content_type); return the key.
        fetch: get_object(...)["Body"].read(). delete: delete_object(Bucket, Key). Translate
        botocore.exceptions.ClientError at the boundary (a missing key on fetch → ProcessingError).
      sources: ["UC-12", "UC-13"]

    - implements: ICanTranscribeAudio
      adapter: openai
      role: Transcriber            # → OpenaiTranscriber
      settings: OpenaiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai async client, audio transcription (settings.transcribe_model, e.g. whisper-1). Send the
        audio bytes; return the text (may be empty for silent audio). Translate openai.OpenAIError →
        ProcessingError at the boundary.
      sources: ["UC-13"]

    - implements: ICanSummarizeMeeting
      adapter: openai
      role: Summarizer             # → OpenaiSummarizer
      settings: OpenaiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai async chat client (settings.summary_model). One call returning structured JSON →
        SummaryDraft(summary, action_item_titles). Prompt the model to return a prose summary plus a
        list of action-item titles in one round-trip. Translate openai.OpenAIError → ProcessingError.
      sources: ["UC-13"]

    - implements: ICanEmbedText
      adapter: openai
      role: Embedder               # → OpenaiEmbedder
      settings: OpenaiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai async embeddings (settings.embed_model). Embed the text → a tuple of floats. Used for
        both the transcript and the search query. Translate openai.OpenAIError → ProcessingError.
      sources: ["UC-13", "UC-15"]

    - implements: ICanRenderPdf       # DELTA UC-17
      adapter: reportlab
      role: PdfRenderer               # → ReportlabPdfRenderer (infrastructure/reportlab/)
      requires_packages: ["reportlab>=4"]
      notes: |
        reportlab — build a simple PDF in memory (BytesIO + canvas/SimpleDocTemplate): the title as a
        heading, the summary as a paragraph, then the action-item lines as a list. Return the buffer's
        bytes. No settings needed (no external service). Pure-CPU; wrapping the sync reportlab call in
        async is fine for v1 (thread-pool offload is a future refinement). Translate any rendering error
        to a domain error at the boundary.
      sources: ["UC-17"]

  datastores:
    - name: main
      kind: postgres
      settings: DbSettings
      sources: ["UC-12"]

    - name: vectors
      kind: qdrant
      settings: QdrantSettings
      requires_packages: ["qdrant-client>=1.9"]
      sources: ["UC-13", "UC-15"]

  repositories:
    - implements: IMeetingRepository
      backs: Meeting
      store: main
      notes: |
        SQLAlchemy Core over the meetings table. add: insert the row (title.value, blob_key, status
        value, created_by, workspace_id; summary/transcript null). get_by_id: select where id == :id
        AND workspace_id == :ws (tenant scope). update: update status/summary/transcript by id. list:
        build the WHERE from the filter (status set via IN, created_after/before on the created_at
        column), ORDER BY the sort key (created_at DESC default, or title), LIMIT/OFFSET from the
        pagination fields. count / count_created_since: SELECT count(*) with the matching WHERE.
      sources: ["UC-12", "UC-13", "UC-14"]

    - implements: IActionItemRepository
      backs: ActionItem
      store: main
      notes: |
        SQLAlchemy Core over the action_items table. add_many: bulk insert (no-op on empty).
        list_for_meeting: select where meeting_id == :id.
      sources: ["UC-13", "UC-14"]

    - implements: IMeetingSearchIndex
      backs: Meeting
      store: vectors
      notes: |
        Qdrant async client over the configured collection. index: upsert a point keyed by meeting_id
        with the embedding vector and a payload {workspace_id} for tenant filtering. search: query the
        collection with the embedding, a workspace_id payload filter, and a limit of top_k; map each
        scored point → SearchHit(meeting_id, score), ranked best-first. Polyglot — this is the second
        repository backing Meeting (the relational one is IMeetingRepository on `main`).
      sources: ["UC-13", "UC-15"]

restapi:

  schemas:
    - name: MeetingRefResponse     # the id ack returned by upload + process
      resource: meetings
      kind: response
      fields:
        - {name: id, type: str}
      sources: ["UC-12", "UC-13"]

    - name: ActionItemRefResponse  # DELTA UC-16 — the id ack returned by complete
      resource: meetings
      kind: response
      fields:
        - {name: id, type: str}
      sources: ["UC-16"]

    - name: MeetingSummaryResponse # one library list row
      resource: meetings
      kind: response
      fields:
        - {name: id, type: str}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: created_by, type: str}
      sources: ["UC-14"]

    - name: MeetingPageResponse    # the paged library list + total
      resource: meetings
      kind: response
      fields:
        - {name: items, type: "list[MeetingSummaryResponse]"}
        - {name: total, type: int}
      sources: ["UC-14"]

    - name: ActionItemResponse
      resource: meetings
      kind: response
      fields:
        - {name: id, type: str}
        - {name: title, type: str}
        - {name: status, type: str}
      sources: ["UC-14"]

    - name: MeetingDetailResponse
      resource: meetings
      kind: response
      fields:
        - {name: id, type: str}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: summary, type: "str | None"}
        - {name: action_items, type: "list[ActionItemResponse]"}
      sources: ["UC-14"]

    - name: SearchRequest
      resource: meetings
      kind: request
      fields:
        - {name: query, type: str}
      sources: ["UC-15"]

    - name: SearchHitResponse
      resource: meetings
      kind: response
      fields:
        - {name: meeting_id, type: str}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: score, type: float}
      sources: ["UC-15"]

    - name: SearchResultsResponse
      resource: meetings
      kind: response
      fields:
        - {name: results, type: "list[SearchHitResponse]"}
      sources: ["UC-15"]

  endpoints:
    - method: POST
      path: /meetings
      resource: meetings
      auth: authenticated
      request_kind: multipart       # audio UploadFile + a title Form field → python-multipart (block D)
      response: MeetingRefResponse
      status_code: 201
      handler: UploadRecording
      notes: |
        Multipart route (restapi-file-transfer): title = Annotated[str, Form()], file = UploadFile.
        Read the bytes (audio = await file.read()); construct Title(title) → ValidationError (422) if
        out of the 3–200 trimmed bound. Build UploadRecordingCommand(caller_id=user.id,
        workspace_id=user.workspace_id, title=Title(title), audio=audio, content_type=file.content_type
        or "application/octet-stream") — caller_id + workspace_id from the token, never the body.
        Dispatch; return MeetingRefResponse(id=str(new_id)). Advertises 401, 402 (quota exceeded —
        upgrade), 413 (too large — MaxRequestSizeMiddleware), 422 (title invalid).
      sources: ["UC-12"]

    - method: POST
      path: /meetings/{meeting_id}/process
      resource: meetings
      auth: authenticated
      response: MeetingRefResponse
      handler: ProcessMeeting
      notes: |
        meeting_id from the path. Build ProcessMeetingCommand(caller_id=user.id,
        workspace_id=user.workspace_id, meeting_id=meeting_id). Dispatch (synchronous); return
        MeetingRefResponse(id=str(result_id)). Advertises 401, 404 (not found / cross-tenant), 422
        (already processed), 502 (processing failed — the meeting is left FAILED).
      sources: ["UC-13"]

    - method: GET
      path: /meetings
      resource: meetings
      auth: authenticated
      response: MeetingPageResponse
      handler: BrowseMeetings
      notes: |
        Parse the query string into a MeetingFilter: status (repeatable → frozenset[MeetingStatus]),
        created_after / created_before (optional datetimes), sort (MeetingSort, default CREATED_AT),
        page + size (default size 20, cap ~100). Build BrowseMeetingsQuery(workspace_id=
        user.workspace_id, filter=...). Dispatch; map result.items → MeetingSummaryResponse[], total.
        Advertises 401.
      sources: ["UC-14"]

    - method: GET
      path: /meetings/{meeting_id}
      resource: meetings
      auth: authenticated
      response: MeetingDetailResponse
      handler: GetMeeting
      notes: |
        meeting_id from the path. Build GetMeetingQuery(workspace_id=user.workspace_id,
        meeting_id=meeting_id). Dispatch; map MeetingDetail → MeetingDetailResponse (action_items →
        ActionItemResponse[]). Advertises 401, 404 (not found / cross-tenant).
      sources: ["UC-14"]

    - method: POST
      path: /meetings/search
      resource: meetings
      auth: authenticated
      request: SearchRequest
      response: SearchResultsResponse
      handler: SearchMeetings
      notes: |
        Construct SearchQuery(body.query) → ValidationError (422) on a blank query (the pre-flight
        gate). Build SearchMeetingsQuery(workspace_id=user.workspace_id, query=SearchQuery(...)).
        Dispatch; map result.items → SearchHitResponse[]. POST (carries a query body). Advertises 401,
        422 (empty query).
      sources: ["UC-15"]

    - method: POST                  # DELTA UC-16
      path: /action-items/{action_item_id}/complete
      resource: meetings
      auth: authenticated
      response: ActionItemRefResponse
      handler: CompleteActionItem
      notes: |
        action_item_id from the path. Build CompleteActionItemCommand(caller_id=user.id,
        workspace_id=user.workspace_id, action_item_id=action_item_id). Dispatch; return
        ActionItemRefResponse(id=str(result_id)). Advertises 401, 404 (not found / cross-tenant).
      sources: ["UC-16"]

    - method: GET                   # DELTA UC-17 — streaming PDF download (restapi-file-transfer)
      path: /meetings/{meeting_id}/export
      resource: meetings
      auth: authenticated
      handler: ExportMeeting
      notes: |
        Streaming binary download (restapi-file-transfer): build ExportMeetingQuery(
        workspace_id=user.workspace_id, meeting_id=meeting_id); dispatch → PDF bytes; return
        StreamingResponse(iter([pdf_bytes]), media_type="application/pdf", headers={"Content-Disposition":
        f'attachment; filename="meeting-{meeting_id}.pdf"'}). No JSON response schema (the body is the
        file). Advertises 401, 404 (not found / cross-tenant), 422 (meeting not READY — nothing to export).
      sources: ["UC-17"]

  middlewares:
    - name: MaxRequestSize
      config:
        max_bytes: 524288000        # 500 MB upload cap (UC-12 A4 / Q3) — rejects oversized bodies with 413
      introduces_http: [413]
      notes: |
        Raw ASGI middleware: reject a request whose Content-Length (or streamed body) exceeds
        max_bytes with a 413 ErrorResponse {code: "REQUEST_TOO_LARGE"}. Bounds the multipart upload
        route. max_bytes is config (passed via add_middleware), not hard-coded in the body.
      sources: ["UC-12"]

tests:
  architecture_rules:
    - name: test_no_print_outside_entrypoints
      pattern: '\bprint\('
      paths: [domain/, application/, infrastructure/]
      allow_list: []
      sources: ["UC-12"]
