# Epic 02 — Meetings — the MeetingMind recording → searchable-record lifecycle.
#
# One bounded context, two subdomains:
#   * meetings — the Meeting aggregate (+ child ActionItem), its status/sort enums, the read-side
#                filter + read-model projections, the quota policy, and the four use cases
#                (UploadMeeting, ProcessMeeting, ListMeetings/GetMeeting, SearchMeetings).
#   * ai       — the external-provider capability ports (transcribe / summarize / embed) and the
#                blob-storage port, with their scaffolded SDK adapters + settings.
#
# Architecture decisions folded in (build-manifest chat):
#   - Bounded context: Meetings is its own context (NOT merged with Accounts); it consumes Accounts
#     READ-ONLY via cross-subdomain refs. Model A (siblings in one package), like helpdesk auth+tickets.
#   - Quota plan source: a LIVE cross-context read — UploadMeeting loads the workspace via
#     workspace:IWorkspaceRepository.get_by_id at upload time and reads .plan (always current; the 1h
#     token would serve a stale plan). Resolves the epic.md "crosses contexts vs denormalized" question.
#   - Quota-exceeded HTTP status (UC-12 A1): 403 Forbidden → QuotaExceededError (code QUOTA_EXCEEDED).
#   - UC-13 two-store partial failure: NO distributed tx across Postgres + Qdrant. Any AI-step or store
#     failure → mark the meeting FAILED, persist, re-raise (ProcessingError); retry re-runs the whole
#     pipeline (idempotent re-index). Embed the WHOLE transcript as ONE vector (chunking deferred).
#   - Polyglot persistence for one aggregate: Meeting is backed by BOTH a relational repo
#     (IMeetingRepository / postgres) AND a vector search index (IMeetingSearchIndex / qdrant). The
#     planner keys the client-store repo on its protocol, so the two-repos-one-aggregate is supported.
#   - Audit timestamps are NOT domain fields (E2): Meeting carries no created_at; the read-model VOs
#     (MeetingSummary / MeetingDetail) carry created_at projected from the row.
#   - Two tunable VOs (config knobs, DI-wired from settings): MeetingQuotaTunable (per-plan limits),
#     MeetingSearchTunable (top-k + relevance threshold).
#
# Cross-epic edges OUT→Accounts (resolved under --app against 01-accounts):
#   workspace:IWorkspaceRepository (UploadMeeting reads Workspace.plan for the quota).
#   The token principal (auth:CurrentUser → workspace_id + created_by) is wired by the SHARED restapi
#   bootstrap (every endpoint is `authenticated`), not a manifest edge.

meta:
  epic: 02-meetings
  name: "MeetingMind Meetings — upload, AI processing, library, semantic search"
  sources: ["UC-12", "UC-13", "UC-14", "UC-15"]

domain:

  enums:
    - name: MeetingStatus
      subdomain: meetings
      base: StrEnum
      members:
        - {name: UPLOADED, value: UPLOADED}
        - {name: PROCESSING, value: PROCESSING}
        - {name: READY, value: READY}
        - {name: FAILED, value: FAILED}
      # No transition-guard methods: the lifecycle is enforced in the ProcessMeeting body (the team
      # wants flexibility to add states like ARCHIVED later — no rigid state-machine table in v1).
      sources: ["UC-12", "UC-13"]

    - name: ActionItemStatus
      subdomain: meetings
      base: StrEnum
      members:
        - {name: OPEN, value: OPEN}
      # v1: the pipeline creates every action item OPEN; nothing transitions them yet (manual
      # add / completion is a future UC). Modelled as an enum so the displayed status is closed-set
      # and the lifecycle can grow without a schema change.
      sources: ["UC-13", "UC-14"]

  value_objects:
    # --- AI-layer values (produced by the capability ports) -------------------------------------
    - name: Embedding
      subdomain: ai
      fields:
        - {name: vector, type: "list[float]"}
      # Type-significance only, NO invariant: the dimension is a deployment constant (the model's,
      # in MeetingAiSettings), and a pure domain VO must not depend on runtime config (hexagon).
      sources: ["UC-13", "UC-15"]

    - name: TranscriptSummary
      subdomain: ai
      fields:
        - {name: summary_text, type: str}
        - {name: action_item_titles, type: "tuple[str, ...]"}
      # The summarization capability returns BOTH in one round-trip (summary prose + zero-or-more
      # action-item titles), so they travel together rather than as two model calls (UC-13 Notes).
      sources: ["UC-13"]

    # --- Read-model projections (projected from the row by the repository; carry audit columns the
    #     Meeting entity must not — E2). Frozen value objects with no invariants. --------------------
    - name: ActionItemView
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: ActionItemStatus}
      sources: ["UC-14"]

    - name: MeetingSummary
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: MeetingStatus}
        - {name: created_at, type: datetime}        # projected from the DB-managed column (E2)
        - {name: created_by, type: UUID}
        - {name: action_item_count, type: int}
      # The list row (UC-14 list): scan-level fields + the action-item COUNT (no full items).
      sources: ["UC-14"]

    - name: MeetingDetail
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: MeetingStatus}
        - {name: created_at, type: datetime}        # projected from the DB-managed column (E2)
        - {name: created_by, type: UUID}
        - {name: summary, type: str}                # empty until processed
        - {name: action_items, type: "tuple[ActionItemView, ...]"}
      # The detail view (UC-14 detail): full summary + the meeting's action items.
      sources: ["UC-14"]

    - name: MeetingSearchMatch
      subdomain: meetings
      fields:
        - {name: meeting_id, type: UUID}
        - {name: score, type: float}
      # What the vector index returns per hit: a meeting id + its similarity score (UC-15).
      sources: ["UC-15"]

    # --- Tunable VOs (env-tunable knobs, DI-wired as Singletons from the matching *Settings) -------
    - name: MeetingQuotaTunable
      subdomain: meetings
      fields:
        - {name: free_limit, type: int}
        - {name: pro_limit, type: int}
        - {name: enterprise_limit, type: int}
      # The per-plan monthly meeting-count caps (UC-12). Pure config knob → tunable VO wired from
      # MeetingQuotaSettings at the DI layer; injected into QuotaPolicy. No methods (the plan→limit
      # mapping is QuotaPolicy body logic, not VO behaviour).
      sources: ["UC-12"]

    - name: MeetingSearchTunable
      subdomain: meetings
      fields:
        - {name: top_k, type: int}
        - {name: relevance_threshold, type: float}
      # Search bounds (UC-15): the top-k cap + the relevance cutoff that drops weak matches. Pure
      # config → tunable VO wired from MeetingSearchSettings; injected into SearchMeetings. The
      # threshold VALUE is ML-calibrated config, never hard-coded.
      sources: ["UC-15"]

  entities:
    - name: Meeting
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: workspace_id, type: UUID}          # tenant owner — from the token, never the body
        - {name: created_by, type: UUID}            # uploader — from the token, never the body
        - {name: title, type: str}
        - {name: blob_key, type: str}               # the audio's blob-storage key
        - {name: status, type: MeetingStatus}
        - {name: summary, type: str, default: '""'}      # filled by ProcessMeeting (UC-13)
        - {name: transcript, type: str, default: '""'}   # filled by ProcessMeeting (UC-13)
        # The aggregate root composes its ActionItem children (UC-13); defaulted, so it lands LAST
        # and keeps a valid dataclass field order. NOT an audit column — a legitimate domain composition.
        - {name: action_items, type: "tuple[ActionItem, ...]", default: "()"}
      # No created_at/updated_at — DB-managed audit columns, not domain fields (E2). The reads that
      # display/sort/filter created_at use the MeetingSummary/MeetingDetail read-models above.
      invariants:
        - rule: "title is 3–200 characters after trimming"
          field: title
          source: spec
      sources: ["UC-12", "UC-13"]

    - name: ActionItem
      subdomain: meetings
      fields:
        - {name: id, type: UUID}
        - {name: meeting_id, type: UUID}            # child of the Meeting aggregate
        - {name: title, type: str}
        - {name: status, type: ActionItemStatus}
      invariants: []
      sources: ["UC-13"]

  filters:
    - name: MeetingListFilter
      subdomain: meetings
      fields:
        - {name: statuses, type: "frozenset[MeetingStatus]"}   # multi-valued (UC-14)
        - {name: created_from, type: "date | None"}
        - {name: created_to, type: "date | None"}
      pagination: true                              # limit/offset; default size 20, max 100 enforced upstream
      sort:
        enum_name: MeetingSort
        keys: [CREATED_AT_DESC, TITLE_ASC]          # newest-first default, or title A–Z (closed set)
        default: CREATED_AT_DESC
      sources: ["UC-14"]

  services:
    - name: QuotaPolicy
      subdomain: meetings
      dependencies: [IMeetingRepository, MeetingQuotaTunable]
      methods:
        - signature: "async def assert_within_quota(self, workspace_id: UUID, plan: Plan) -> None"
          raises: [QuotaExceededError]
          notes: |
            Enforce the monthly meeting-count cap (UC-12). Compute the current UTC calendar-month
            start; count = IMeetingRepository.count_created_since(workspace_id, month_start); pick the
            limit for `plan` from the tunable (FREE→free_limit, PRO→pro_limit, ENTERPRISE→enterprise_limit);
            raise QuotaExceededError when count >= limit. All numbers come from MeetingQuotaTunable —
            never hard-coded. `plan` is the cross-context workspace:Plan (resolved in app-mode).
      notes: "The monthly-quota rule. Stateless apart from the injected repo + tunable; raises only QuotaExceededError."
      sources: ["UC-12"]

  repository_protocols:
    - name: IMeetingRepository
      subdomain: meetings
      aggregate: Meeting
      methods:
        - "async def add(self, meeting: Meeting) -> None"
        - signature: "async def get_by_id(self, meeting_id: UUID, workspace_id: UUID) -> Meeting"
          notes: "Tenant-scoped load (write model, for ProcessMeeting). NotFoundError when missing or in another workspace (cross-tenant indistinguishable from not-found)."
        - signature: "async def update(self, meeting: Meeting) -> None"
          notes: "Persist a mutated meeting AND upsert/replace its action_items rows (from meeting.action_items) alongside the meeting row, atomically (the aggregate root owns its ActionItems)."
        - signature: "async def count_created_since(self, workspace_id: UUID, since: datetime) -> int"
          notes: "Count meetings created in the workspace at/after `since` (the quota's calendar-month count)."
        - signature: "async def list_summaries(self, workspace_id: UUID, filter: MeetingListFilter) -> tuple[tuple[MeetingSummary, ...], int]"
          notes: "Tenant-scoped paged read → (page of MeetingSummary read-models, total matching count). Projects created_at + the action-item count from the rows; applies the filter's statuses/date-range/sort/limit/offset. An out-of-range page → empty page + the real total (UC-14 A3)."
        - signature: "async def get_detail(self, meeting_id: UUID, workspace_id: UUID) -> MeetingDetail"
          notes: "Tenant-scoped detail read-model (joins the action items). NotFoundError when missing/cross-tenant."
        - signature: "async def find_by_ids(self, workspace_id: UUID, meeting_ids: tuple[UUID, ...]) -> tuple[Meeting, ...]"
          notes: "Batch load for search result hydration; returns ONLY the existing ones (silently skips a since-deleted id — UC-15 A2). Order is not guaranteed; the caller re-orders by the search ranking."
      raises: [NotFoundError]
      sources: ["UC-12", "UC-13", "UC-14"]

    - name: IMeetingSearchIndex
      subdomain: meetings
      aggregate: Meeting
      # The vector (Qdrant) side of the Meeting aggregate — a search index, not a CRUD repository,
      # so it is named for its role (the polyglot second repo; planner keys it on its protocol).
      methods:
        - signature: "async def index(self, meeting_id: UUID, workspace_id: UUID, embedding: Embedding) -> None"
          notes: "Upsert the meeting's transcript embedding tenant-scoped (workspace_id in the payload), one vector per transcript. Re-indexing the same meeting overwrites (retry-safe)."
        - signature: "async def search(self, workspace_id: UUID, query_embedding: Embedding, k: int, threshold: float) -> tuple[MeetingSearchMatch, ...]"
          notes: "Return up to k nearest matches in the workspace's index, best-first, dropping any below `threshold` (so the result may be smaller than k or empty — UC-15). Tenant-scoped by workspace_id."
      raises: []
      sources: ["UC-13", "UC-15"]

  capability_protocols:
    - name: ICanStoreBlobs
      subdomain: ai
      methods:
        - signature: "async def put(self, data: bytes, content_type: str) -> str"
          notes: "Store the bytes and return the storage key."
        - signature: "async def get(self, key: str) -> bytes"
          notes: "Fetch the bytes for a stored key."
        - signature: "async def delete_best_effort(self, key: str) -> None"
          notes: "Compensating undo — delete a just-stored blob, swallowing not-found/transport errors (never raises). Used by UploadMeeting when the DB write fails after the upload."
      notes: "A blob/object store port (put/get + a best-effort compensating delete). Tech (S3) lives in the adapter, not here."
      sources: ["UC-12", "UC-13"]

    - name: ICanTranscribeAudio
      subdomain: ai
      methods:
        - signature: "async def transcribe(self, audio: bytes) -> str"
          notes: "Transcribe the audio bytes to plain text; may return an empty string for silent/corrupt audio (UC-13 A4 turns that into ProcessingError)."
      notes: "A stateless speech-to-text port backed by an external (Whisper-class) model."
      sources: ["UC-13"]

    - name: ICanSummarize
      subdomain: ai
      methods:
        - signature: "async def summarize(self, transcript: str) -> TranscriptSummary"
          notes: "One round-trip → a prose summary + zero-or-more action-item titles (TranscriptSummary)."
      notes: "A stateless summarize-and-extract port backed by an external LLM."
      sources: ["UC-13"]

    - name: ICanEmbedText
      subdomain: ai
      methods:
        - signature: "async def embed(self, text: str) -> Embedding"
          notes: "Map text to its embedding vector (the configured model/dimension). Used to index transcripts and to embed search queries."
      notes: "A stateless text→vector encoder backed by an external embedding model."
      sources: ["UC-13", "UC-15"]

  # Earned per UC (no blanket catalog). NotFoundError = UC-13 A1 / UC-14 A2 (missing or cross-tenant).
  # ValidationError = UC-13 A2 (process a non-UPLOADED/FAILED meeting) + UC-15 A3 (empty query) + the
  # Meeting title invariant. QuotaExceededError = UC-12 A1 (403). ProcessingError = UC-13 A3/A4 (AI
  # pipeline failure / empty transcription → FAILED). No ConflictError (meetings insert against no
  # unique constraint — ids are fresh UUIDs); no ForbiddenError (no role-gated route).
  exceptions:
    - {name: NotFoundError, code: NOT_FOUND, http_status: 404, sources: ["UC-13", "UC-14"]}
    - {name: ValidationError, code: VALIDATION_ERROR, http_status: 422, sources: ["UC-13", "UC-15"]}
    - {name: QuotaExceededError, code: QUOTA_EXCEEDED, http_status: 403, sources: ["UC-12"]}
    - {name: ProcessingError, code: PROCESSING_FAILED, http_status: 502, sources: ["UC-13"]}

application:

  commands:
    - name: UploadMeeting
      input:
        - {name: title, type: str}
        - {name: audio, type: bytes}
        - {name: content_type, type: str}
        - {name: workspace_id, type: UUID}          # from the token (endpoint-stamped), never the body
        - {name: created_by, type: UUID}            # from the token (endpoint-stamped), never the body
      output: "UUID"
      handler:
        dependencies: [workspace:IWorkspaceRepository, QuotaPolicy, ICanStoreBlobs, IMeetingRepository]
      log_event: meeting_uploaded
      raises: [QuotaExceededError]
      notes: |
        Ingest half only (UC-12); processing is the separate ProcessMeeting call.
        Orchestration (multi-dependency; canonical scenarios in the manual stub):
          1. Load the workspace for its plan: workspace:IWorkspaceRepository.get_by_id(workspace_id).
          2. QuotaPolicy.assert_within_quota(workspace_id, workspace.plan) — raises QuotaExceededError
             (403). Checked BEFORE any blob upload, so a refusal leaves no blob and no row (A1).
          3. ICanStoreBlobs.put(audio, content_type) → blob_key.
          4. Build Meeting(fresh id, title (trimmed), blob_key, status=UPLOADED, created_by,
             workspace_id, summary="", transcript=""); IMeetingRepository.add(meeting).
          5. Return meeting.id.
        COMPENSATING TRANSACTION (pattern-compensating-tx): if step 4's add fails after step 3's
        upload, ICanStoreBlobs.delete_best_effort(blob_key) then re-raise — no orphan blob, no row
        pointing at a missing blob. created_by/workspace_id come from the token (the endpoint), never
        the request body.
      behaviour:
        - given: "a workspace within its monthly quota"
          when: execute
          then: {persists: Meeting, with: {status: UPLOADED}}
          source: spec
        - given: "a workspace over its monthly quota"
          when: execute
          then: {raises: QuotaExceededError}
          source: spec
        - given: "the blob upload succeeds but the row write fails"
          when: execute
          then: {calls: "ICanStoreBlobs.delete_best_effort"}
          source: spec
      sources: ["UC-12"]

    - name: ProcessMeeting
      input:
        - {name: meeting_id, type: UUID}
        - {name: workspace_id, type: UUID}          # from the token (endpoint-stamped)
      output: "None"
      handler:
        dependencies: [IMeetingRepository, IMeetingSearchIndex, ICanStoreBlobs, ICanTranscribeAudio, ICanSummarize, ICanEmbedText]
      log_event: meeting_processed
      raises: [NotFoundError, ValidationError, ProcessingError]
      notes: |
        The synchronous v1 AI pipeline (UC-13). Output is None — the client re-reads the detail
        (GetMeeting) for the summary; the command only drives the state transition.
        Orchestration (multi-dependency; canonical scenarios in the manual stub):
          1. IMeetingRepository.get_by_id(meeting_id, workspace_id) → NotFoundError if missing/cross-tenant (A1).
          2. If status not in {UPLOADED, FAILED} → raise ValidationError; nothing is overwritten (A2,
             refuse re-processing a READY meeting).
          3. Set status=PROCESSING; IMeetingRepository.update(meeting).
          4. Run the pipeline (the FAILURE-STATE-THEN-RE-RAISE try/except — application-command rule 5):
               audio = ICanStoreBlobs.get(meeting.blob_key)
               transcript = ICanTranscribeAudio.transcribe(audio); if blank → raise ProcessingError (A4)
               summary = ICanSummarize.summarize(transcript)  (TranscriptSummary: text + titles)
               embedding = ICanEmbedText.embed(transcript)
               IMeetingSearchIndex.index(meeting_id, workspace_id, embedding)
               set status=READY, summary=summary.summary_text, transcript; build one ActionItem per
               title (status=OPEN, meeting_id) and SET them onto the meeting (meeting.action_items=...);
               IMeetingRepository.update(meeting) — which now persists the action_items alongside it.
             On ANY exception in this block: set status=FAILED, IMeetingRepository.update(meeting),
             then re-raise as ProcessingError (no partial summary shown — A3/A4).
        No distributed tx across Postgres + Qdrant: a retry (FAILED→PROCESSING) re-runs the whole
        pipeline; re-indexing is idempotent (overwrite). One vector per transcript (chunking deferred).
      behaviour:
        - given: "an UPLOADED meeting the caller owns"
          when: execute
          then: {persists: Meeting, with: {status: READY}}
          source: spec
        - given: "a missing or cross-tenant meeting"
          when: execute
          then: {raises: NotFoundError}
          source: spec
        - given: "an already-READY meeting"
          when: execute
          then: {raises: ValidationError}
          source: spec
        - given: "transcription returns empty (silent/corrupt audio), leaving the meeting FAILED"
          when: execute
          then: {raises: ProcessingError}
          source: spec
        - given: "an AI step fails, leaving the meeting FAILED"
          when: execute
          then: {raises: ProcessingError}
          source: spec
      sources: ["UC-13"]

  queries:
    - name: ListMeetings
      input:
        - {name: workspace_id, type: UUID}          # from the token (endpoint-stamped)
        - {name: filter, type: MeetingListFilter}
      output: MeetingListResult
      result_fields:
        - {name: items, type: "tuple[MeetingSummary, ...]"}
        - {name: total, type: int}
      handler: {dependencies: [IMeetingRepository]}
      notes: |
        IMeetingRepository.list_summaries(workspace_id, filter) → (page, total); wrap in
        MeetingListResult. Tenant-scoped to the token's workspace_id (never a request param). An
        over-narrow filter or empty workspace → empty items + total 0 (A1); an out-of-range page →
        empty items + the real total (A3). Page size / sort / status / date-range all ride the filter
        (defaults 20, max 100 applied where the filter is built) — no magic numbers in the body.
      behaviour:
        - given: "meetings exist in the workspace"
          when: execute
          then: {returns: MeetingListResult}
          source: spec
      sources: ["UC-14"]

    - name: GetMeeting
      input:
        - {name: meeting_id, type: UUID}
        - {name: workspace_id, type: UUID}          # from the token (endpoint-stamped)
      output: MeetingDetail
      handler: {dependencies: [IMeetingRepository]}
      raises: [NotFoundError]
      notes: |
        IMeetingRepository.get_detail(meeting_id, workspace_id) → MeetingDetail (id, title, status,
        created_at, created_by, summary, action items). Tenant-scoped; NotFoundError for a missing or
        cross-tenant id (indistinguishable — A2). The summary is empty until the meeting is processed.
      behaviour:
        - given: "an existing meeting in the caller's workspace"
          when: execute
          then: {returns: MeetingDetail}
          source: spec
        - given: "a missing or cross-tenant meeting"
          when: execute
          then: {raises: NotFoundError}
          source: spec
      sources: ["UC-14"]

    - name: SearchMeetings
      input:
        - {name: query, type: str}
        - {name: workspace_id, type: UUID}          # from the token (endpoint-stamped)
      output: SearchResult
      result_fields:
        - {name: items, type: "tuple[SearchHit, ...]"}
      result_dtos:
        - name: SearchHit
          fields:
            - {name: meeting_id, type: UUID}
            - {name: title, type: str}
            - {name: status, type: MeetingStatus}
            - {name: score, type: float}
      handler: {dependencies: [IMeetingSearchIndex, ICanEmbedText, IMeetingRepository, MeetingSearchTunable]}
      raises: [ValidationError]
      notes: |
        Semantic search (UC-15), tenant-scoped.
          1. Reject an empty/whitespace query → ValidationError (don't embed empty text — A3).
          2. ICanEmbedText.embed(query) → query_embedding.
          3. IMeetingSearchIndex.search(workspace_id, query_embedding, MeetingSearchTunable.top_k,
             MeetingSearchTunable.relevance_threshold) → matches (meeting_id, score), best-first,
             weak matches already dropped (so the result may be < top_k or empty — A1).
          4. IMeetingRepository.find_by_ids(workspace_id, [m.meeting_id ...]) hydrates titles/statuses,
             SILENTLY skipping any since-deleted id (A2); build one SearchHit per surviving match,
             preserving the search ranking.
        Only READY meetings are ever indexed, so only they can match. top_k/threshold come from the
        tunable — never hard-coded.
      behaviour:
        - given: "indexed meetings relevant to the query"
          when: execute
          then: {returns: SearchResult}
          source: spec
        - given: "an empty/whitespace query"
          when: execute
          then: {raises: ValidationError}
          source: spec
      sources: ["UC-15"]

infrastructure:

  settings:
    # The shared Postgres connection — env_prefix stems on the APP (MM_), so under app-mode the
    # substrate DbSettings collapses to ONE across contexts (architect rule 10). `name` default is
    # the shared app DB, overridden by MM_DB_NAME in deployment.
    - name: DbSettings
      env_prefix: MM_DB_
      fields:
        - {name: host, type: str, default: '"localhost"'}
        - {name: port, type: int, default: "5432"}
        - {name: user, type: str, default: '"postgres"'}
        - {name: password, type: SecretStr, secret: true}
        - {name: name, type: str, default: '"meetingmind"'}
      sources: ["UC-12"]

    - name: QdrantSettings
      env_prefix: MM_QDRANT_
      fields:
        - {name: url, type: str, default: '"http://localhost:6333"'}
        - {name: api_key, type: SecretStr, secret: true}
        - {name: collection, type: str, default: '"meeting_transcripts"'}
      sources: ["UC-13", "UC-15"]

    # One provider (OpenAI) shared by the three AI capabilities — one credential + one env prefix;
    # each capability reads its own model field (mirrors vector_rag's OpenaiSettings).
    - name: MeetingAiSettings
      env_prefix: MM_AI_
      fields:
        - {name: api_key, type: SecretStr, secret: true}
        - {name: transcription_model, type: str, default: '"whisper-1"'}
        - {name: summarization_model, type: str, default: '"gpt-4o-mini"'}
        - {name: embedding_model, type: str, default: '"text-embedding-3-small"'}
        - {name: embedding_dimension, type: int, default: "1536"}
      sources: ["UC-13", "UC-15"]

    - name: BlobSettings
      env_prefix: MM_BLOB_
      fields:
        - {name: bucket, type: str, default: '"meeting-recordings"'}
        - {name: endpoint_url, type: str, default: '"http://localhost:9000"'}
        - {name: access_key, type: SecretStr, secret: true}
        - {name: secret_key, type: SecretStr, secret: true}
        - {name: region, type: str, default: '"us-east-1"'}
      sources: ["UC-12", "UC-13"]

    # Feeds MeetingQuotaTunable (stem-matched: <Stem>Tunable ← <Stem>Settings). Per-tier monthly
    # caps are deployment config (security/billing retune without a deploy).
    - name: MeetingQuotaSettings
      env_prefix: MM_QUOTA_
      fields:
        - {name: free_limit, type: int, default: "5"}
        - {name: pro_limit, type: int, default: "100"}
        - {name: enterprise_limit, type: int, default: "10000"}
      sources: ["UC-12"]

    # Feeds MeetingSearchTunable. The relevance threshold is ML-calibrated config.
    - name: MeetingSearchSettings
      env_prefix: MM_SEARCH_
      fields:
        - {name: top_k, type: int, default: "10"}
        - {name: relevance_threshold, type: float, default: "0.7"}
      sources: ["UC-15"]

  datastores:
    - name: main
      kind: postgres
      settings: DbSettings
      sources: ["UC-12", "UC-13", "UC-14"]
    - name: vectors
      kind: qdrant
      settings: QdrantSettings
      requires_packages: ["qdrant-client>=1.9"]
      sources: ["UC-13", "UC-15"]

  capabilities:
    - implements: ICanStoreBlobs
      adapter: s3
      role: BlobStore          # → S3BlobStore
      settings: BlobSettings
      requires_packages: ["boto3", "aioboto3"]   # async S3 client; no version floor (stable API)
      notes: |
        aioboto3 S3 client built from BlobSettings (endpoint_url for S3-compatible/MinIO). put:
        generate a key (e.g. f"recordings/{uuid4()}"), put_object(Bucket=bucket, Key=key,
        Body=data, ContentType=content_type), return the key. get: get_object → read the body bytes.
        delete_best_effort: delete_object, swallowing ClientError/NoSuchKey (never raise). Map other
        SDK/transport errors on put/get → ProcessingError.
      sources: ["UC-12", "UC-13"]

    - implements: ICanTranscribeAudio
      adapter: openai
      role: Transcriber        # → OpenaiTranscriber
      settings: MeetingAiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai client (settings.transcription_model, e.g. whisper-1). transcribe: send the audio
        bytes to the transcription endpoint, return the text (may be empty for silence). Map
        provider/HTTP errors → ProcessingError.
      sources: ["UC-13"]

    - implements: ICanSummarize
      adapter: openai
      role: Summarizer         # → OpenaiSummarizer
      settings: MeetingAiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        Chat completion (settings.summarization_model): one structured round-trip → a prose summary
        + a list of action-item titles, mapped into TranscriptSummary(summary_text, action_item_titles).
        Map provider errors → ProcessingError.
      sources: ["UC-13"]

    - implements: ICanEmbedText
      adapter: openai
      role: TextEmbedder       # → OpenaiTextEmbedder
      settings: MeetingAiSettings
      requires_packages: ["openai>=1.30"]
      notes: |
        openai client (settings.embedding_model / embedding_dimension). embed: POST one embedding
        for the text, map the response vector → Embedding. Map provider errors → ProcessingError.
      sources: ["UC-13", "UC-15"]

  repositories:
    - implements: IMeetingRepository
      backs: Meeting
      store: main
      notes: |
        Relational repo for the Meeting aggregate (+ its action_items child table). count_created_since
        counts rows with created_at >= since for the workspace. list_summaries projects MeetingSummary
        (joining a per-meeting action-item COUNT) and applies the filter's statuses/date-range/sort/
        limit/offset. get_detail joins the action items into MeetingDetail. find_by_ids returns only
        existing rows (silent skip). Map IntegrityError → the domain exceptions at the boundary.
      sources: ["UC-12", "UC-13", "UC-14"]
    - implements: IMeetingSearchIndex
      backs: Meeting
      store: vectors
      notes: |
        Qdrant adapter over the configured collection. index: upsert a point (id=meeting_id,
        vector=embedding.vector, payload={workspace_id, meeting_id}); one vector per transcript.
        search: client.search(collection, query_vector, limit=k, score_threshold=threshold,
        query_filter=workspace_id) → MeetingSearchMatch(meeting_id, score) best-first. Map SDK
        errors → ProcessingError.
      sources: ["UC-13", "UC-15"]

restapi:

  schemas:
    - name: MeetingCreatedResponse
      resource: meetings
      kind: response
      fields:
        - {name: id, type: UUID}
      sources: ["UC-12"]

    - name: ActionItemResponse
      resource: meetings
      kind: response
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: str}
      sources: ["UC-14"]

    - name: MeetingResponse        # detail
      resource: meetings
      kind: response
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: created_at, type: datetime}
        - {name: created_by, type: UUID}
        - {name: summary, type: str}
        - {name: action_items, type: "Sequence[ActionItemResponse]"}
      sources: ["UC-14"]

    - name: MeetingSummaryResponse   # list row
      resource: meetings
      kind: response
      fields:
        - {name: id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: created_at, type: datetime}
        - {name: created_by, type: UUID}
        - {name: action_item_count, type: int}
      sources: ["UC-14"]

    - name: MeetingListResponse
      resource: meetings
      kind: response
      fields:
        - {name: items, type: "Sequence[MeetingSummaryResponse]"}
        - {name: total, type: int}
      sources: ["UC-14"]

    - name: SearchRequest
      resource: search
      kind: request
      fields:
        - {name: query, type: str}
      sources: ["UC-15"]

    - name: SearchHitResponse
      resource: search
      kind: response
      fields:
        - {name: meeting_id, type: UUID}
        - {name: title, type: str}
        - {name: status, type: str}
        - {name: score, type: float}
      sources: ["UC-15"]

    - name: SearchResponse
      resource: search
      kind: response
      fields:
        - {name: items, type: "Sequence[SearchHitResponse]"}
      sources: ["UC-15"]

  endpoints:
    # Multipart upload: request_kind=multipart → the route derives `file: UploadFile` from the
    # command's `audio: bytes` input and `title` from a Form field; content_type comes from the
    # UploadFile (not a separate form field); workspace_id/created_by from the token.
    - method: POST
      path: /meetings
      resource: meetings
      auth: authenticated
      request_kind: multipart
      response: MeetingCreatedResponse
      status_code: 201
      handler: UploadMeeting
      notes: |
        Multipart: file (UploadFile, the audio) + title (Form, 3–200 trimmed). content_type =
        file.content_type. workspace_id = current_user.workspace_id, created_by = current_user.id
        (from the token, NEVER the body). Read the bytes and call UploadMeeting; map the returned id
        → MeetingCreatedResponse. Advertise 413 (MaxRequestSizeMiddleware) and 403 (QuotaExceededError).
      sources: ["UC-12"]

    - method: POST
      path: /meetings/{meeting_id}/process
      resource: meetings
      auth: authenticated
      status_code: 200
      handler: ProcessMeeting
      notes: |
        Synchronous processing trigger (UC-13). Pass meeting_id + current_user.workspace_id into
        ProcessMeeting; on success return 200 with no body (the client re-reads GET /meetings/{id}
        for the summary). Advertise 404 (missing/cross-tenant), 422 (already-READY), 502 (processing
        failure).
      sources: ["UC-13"]

    - method: GET
      path: /meetings
      resource: meetings
      auth: authenticated
      response: MeetingListResponse
      handler: ListMeetings
      notes: |
        Parse query params into a MeetingListFilter: status (optional, repeated → frozenset),
        created_after / created_before (optional dates), sort (MeetingSort, default CREATED_AT_DESC),
        page + size (default size 20, max 100 — clamp). workspace_id = current_user.workspace_id.
        Map the MeetingListResult → MeetingListResponse (items + total).
      sources: ["UC-14"]

    - method: GET
      path: /meetings/{meeting_id}
      resource: meetings
      auth: authenticated
      response: MeetingResponse
      handler: GetMeeting
      notes: |
        Pass meeting_id + current_user.workspace_id into GetMeeting; map MeetingDetail →
        MeetingResponse (action_items → Sequence[ActionItemResponse]). Advertise 404.
      sources: ["UC-14"]

    - method: POST
      path: /search
      resource: search
      auth: authenticated
      request: SearchRequest
      response: SearchResponse
      status_code: 200              # search creates nothing; override POST→201
      handler: SearchMeetings
      notes: |
        Pass request.query + current_user.workspace_id into SearchMeetings; map SearchResult →
        SearchResponse (items, ranked best-first). Advertise 422 (empty query).
      sources: ["UC-15"]

  middlewares:
    - name: MaxRequestSizeMiddleware
      config: {max_bytes: 524288000}   # 500 MB cap (UC-12 A4) — deployment config, not hard-coded behaviour
      introduces_http: [413]
      notes: |
        Raw ASGI middleware: reject a request whose Content-Length (or streamed body) exceeds
        max_bytes with a 413 ErrorResponse (code REQUEST_TOO_LARGE) before the route runs. Bounds the
        audio upload; the byte limit is config (max_bytes), not hard-coded.
      sources: ["UC-12"]

tests:
  architecture_rules:
    - name: test_no_print_outside_entrypoints
      pattern: '\bprint\('
      paths: [domain/, application/, infrastructure/]
      allow_list: []
      sources: []
