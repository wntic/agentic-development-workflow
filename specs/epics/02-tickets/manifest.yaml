# Epic 02 — Tickets (open a support ticket).
#
# Bounded context: Tickets alone (approved). This manifest owns the Ticket aggregate, the
# TicketStatus enum, the Title/Description value objects, the assignment policy, and the
# ticket repository. It is a SEPARATE context from Identity (epic 01): the two do not change
# together (a ticket's lifecycle and a user's credentials evolve independently).
#
# Source: UC-02 (refined). Creation only — assignment/triage/resolution are later UCs that
# ride on this aggregate.
#
# CROSS-EPIC EDGES into Identity (epic 01), validator-warned, resolved at scaffold time once
# the cross-epic-resolution frontier is built:
#   * TicketAssignmentPolicy.dependencies → auth:IUserRepository (reads a user by id, calls the
#     get_by_id method the UC-02 delta added to epic 01's IUserRepository).
#   * The policy's body references auth:Role.AGENT (the role a valid assignee must hold) and the
#     auth:User entity returned by get_by_id — type references carried in `notes`, not edges.
#   * The /tickets endpoint is `authenticated` → it binds epic 01's get_current_user dependency;
#     the created_by stamp is the caller_id derived from that auth (spec §5).
#
# Architecture decision folded in (the parked epic.md question — status as a free enum vs a
# guarded transition table): FREE StrEnum. UC-02 fixes only that creation state is OPEN and the
# team wants the flexibility to add states later; a guarded transition table would freeze a
# state machine the UC explicitly declines. TicketStatus carries only OPEN now — later lifecycle
# UCs add members (and any transition rules) by delta (anticipation-litmus, PRINCIPLES B2).

meta:
  epic: 02-tickets
  name: "Tickets — open a support ticket (authenticated)"
  sources: ["specs/use-cases/UC-02-create-ticket.md"]

domain:

  enums:
    - name: TicketStatus
      subdomain: tickets
      base: StrEnum
      members:
        - {name: OPEN, value: OPEN}
      # Only OPEN: UC-02 is creation-only and OPEN is the sole creation state. No CLOSED/RESOLVED
      # yet — those arrive with the lifecycle UCs that transition the ticket, as a delta. No
      # `satisfies`/transition method (a free enum, no guarded machine — the approved decision).
      sources: ["UC-02"]

  value_objects:
    - name: Title
      subdomain: tickets
      # Transient creation input modeled as a VO so the 3–200 bound is a STRUCTURAL pre-flight
      # gate (constructing it fails before the store is touched), mirroring epic 01's Email/Password.
      fields:
        - {name: value, type: str}
      invariants:
        - rule: "3–200 characters inclusive, measured AFTER trimming surrounding whitespace; the stored value is the trimmed form"
          field: value
          source: spec
      sources: ["UC-02"]

    - name: Description
      subdomain: tickets
      fields:
        - {name: value, type: str}
      invariants:
        - rule: "non-empty AFTER trimming surrounding whitespace; no maximum length in v1; the stored value is the trimmed form"
          field: value
          source: spec
      sources: ["UC-02"]

  entities:
    - name: Ticket
      subdomain: tickets
      fields:
        - {name: id, type: UUID}
        - {name: title, type: Title}
        - {name: description, type: Description}
        - {name: status, type: TicketStatus, default: "TicketStatus.OPEN"}
        # created_by / assignee are raw user-id references into the Identity context (you reference
        # the other aggregate by id, never embed it). created_by = the authenticated reporter.
        - {name: created_by, type: UUID}
        - {name: assignee, type: "UUID | None", optional: true, default: "None"}
      # No __post_init__ invariant: the field invariants live in the Title/Description VOs, and
      # "only an Agent may be an assignee" is a cross-aggregate rule (it reads the user store) —
      # that is the TicketAssignmentPolicy domain service, not an entity check.
      invariants: []
      sources: ["UC-02"]

  services:
    - name: TicketAssignmentPolicy     # the cross-epic assignee check (A2)
      subdomain: tickets
      dependencies: [auth:IUserRepository]   # cross-epic edge → epic 01 (validator warning until resolved)
      methods:
        - signature: "async def assert_assignable(self, assignee_id: UUID) -> None"
          raises: [InvalidAssigneeError]
          behaviour:                   # cross-epic dependency → manual stub
            - given: "an assignee id that references an existing user with the Agent role"
              when: assert_assignable
              then: {returns: None}
              source: spec
            - given: "an assignee id that references a user who is not an Agent"
              when: assert_assignable
              then: {raises: InvalidAssigneeError}   # A2
              source: spec
            - given: "an assignee id that references no existing user"
              when: assert_assignable
              then: {raises: InvalidAssigneeError}   # A2 — non-existent and non-Agent collapse to the same error
              source: spec
          notes: |
            Load the user via the injected auth:IUserRepository.get_by_id(assignee_id). If it
            returns None (no such user), raise InvalidAssigneeError. If the user exists but
            user.role is not auth:Role.AGENT, raise InvalidAssigneeError. Otherwise return None.
            Non-existent and non-Agent collapse to the SAME error ("cannot assign to this user") —
            do not distinguish them. The caller validates an assignee only when one was supplied;
            an unassigned ticket never reaches this policy.
      notes: |
        The only place that crosses into the Identity context. Stateless apart from the injected
        repository. Encapsulates the A2 rule a thin handler must not carry; it reads the user store
        (epic 01) and judges the Agent role.
      sources: ["UC-02"]

  repository_protocols:
    - name: ITicketRepository
      subdomain: tickets
      aggregate: Ticket
      methods:
        # Creation-only epic: a single append. No get/list/update yet — those arrive with the
        # lifecycle/read UCs as deltas (anticipation-litmus).
        - signature: "async def add(self, ticket: Ticket) -> None"
          notes: "Insert the new ticket row. The id is assigned by the domain at construction, so this is a pure append; a duplicate id is an integrity error, not an expected path."
      sources: ["UC-02"]

  # Tickets' error catalog. ValidationError is raised by the Title/Description __post_init__
  # (the pre-flight gate, A1/A1b); InvalidAssigneeError is the A2 outcome. NOTE: ValidationError
  # is ALSO declared by epic 01 — when the two contexts are scaffolded into one package the
  # catalog must be shared, not duplicated (a cross-epic-resolution frontier item).
  exceptions:
    - {name: ValidationError, code: VALIDATION_ERROR, http_status: 422, sources: ["UC-02"]}
    - {name: InvalidAssigneeError, code: INVALID_ASSIGNEE, http_status: 422, sources: ["UC-02"]}   # A2

application:

  commands:
    - name: CreateTicket
      input:
        - {name: title, type: Title}            # the route constructs the VOs from the request strings
        - {name: description, type: Description} # (their __post_init__ are the trim + bound gate)
        - {name: assignee, type: "UUID | None"}  # optional; None ⇒ unassigned, skip the policy
      output: UUID                                # the new ticket id
      handler: {dependencies: [ITicketRepository, TicketAssignmentPolicy]}
      raises: [InvalidAssigneeError]
      behaviour:                                  # multi-dependency → manual stub
        - given: "a valid title and description and no assignee"
          when: execute
          then: {persists: Ticket, with: {status: OPEN}}
          source: spec
        - given: "a valid title and description and an assignee who is an Agent"
          when: execute
          then: {persists: Ticket, with: {status: OPEN}}
          source: spec
        - given: "an assignee who is not an Agent (or does not exist)"
          when: execute
          then: {raises: InvalidAssigneeError}    # A2 — no ticket persisted
          source: spec
      notes: |
        Thin. When query.assignee is not None, first await TicketAssignmentPolicy.assert_assignable(
        assignee) — it raises InvalidAssigneeError if the assignee is not an existing Agent (no ticket
        is created on that path). Then build the Ticket: id = a fresh uuid4, title/description from the
        command VOs, status = TicketStatus.OPEN, created_by = the caller_id (the authenticated reporter,
        derived from the endpoint's auth — never taken from the request body), assignee = query.assignee.
        await ITicketRepository.add(ticket); return ticket.id. No business logic beyond this orchestration.
      sources: ["UC-02"]

infrastructure:

  settings:
    # Same DbSettings as epic 01 — duplicated here because the manifest is per-context; the two
    # contexts share one Postgres at deploy time, so this collapses to a single settings class when
    # they are scaffolded into one package (cross-epic-resolution frontier).
    - name: DbSettings
      env_prefix: HELPDESK_DB_
      fields:
        - {name: host, type: str, default: '"localhost"'}
        - {name: port, type: int, default: "5432"}
        - {name: user, type: str, default: '"postgres"'}
        - {name: password, type: SecretStr, secret: true}
        - {name: name, type: str, default: '"helpdesk"'}
      sources: ["UC-02"]

  datastores:
    - name: main
      kind: postgres
      settings: DbSettings
      sources: ["UC-02"]

  repositories:
    - implements: ITicketRepository
      backs: Ticket
      store: main
      notes: |
        add: SQLAlchemy Core insert(tickets_table).values(...) mapping the Ticket fields — title and
        description persist their trimmed string `.value`, status persists the enum value (a string
        column), created_by/assignee persist as uuid columns (assignee nullable). One row per ticket;
        an IntegrityError on the primary key maps to a domain error (not an expected creation path).
      sources: ["UC-02"]

restapi:

  schemas:
    - name: CreateTicketRequest
      resource: tickets
      kind: request
      fields:
        - {name: title, type: str}
        - {name: description, type: str}
        - {name: assignee, type: "str | None"}    # an Agent's user id, or null for unassigned
      sources: ["UC-02"]

    - name: TicketResponse
      resource: tickets
      kind: response
      fields:
        - {name: id, type: str}
      sources: ["UC-02"]

  endpoints:
    - method: POST
      path: /tickets
      resource: tickets
      auth: authenticated          # any authenticated user may open a ticket (binds epic 01's get_current_user)
      request: CreateTicketRequest
      response: TicketResponse
      handler: CreateTicket
      notes: |
        Construct Title(body.title) and Description(body.description) from the request — their
        __post_init__ trim and enforce the 3–200 / non-empty gate, raising ValidationError (→ 422)
        BEFORE the handler runs. Parse body.assignee into UUID | None (null ⇒ unassigned). Build the
        CreateTicket command with the caller_id taken from the authenticated user (the created_by
        stamp — never from the body, per the reporter-stamp rule). Dispatch; map the returned id:
        TicketResponse(id=str(ticket_id)). Advertises 401 (unauthenticated), 422 (malformed title /
        description, and INVALID_ASSIGNEE when the supplied assignee is not an existing Agent).
      sources: ["UC-02"]

tests:
  architecture_rules:
    - name: test_no_print_outside_entrypoints
      pattern: '\bprint\('
      paths: [domain/, application/, infrastructure/]
      allow_list: []
      sources: ["UC-02"]
