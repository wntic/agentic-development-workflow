# The repository's own toolchain — nothing else.
#
# This repo is a Claude Code marketplace holding one plugin (`plugins/adw/`). It is not a
# distributable package: there is deliberately no `[build-system]`, because the plugin ships by
# location, not as a wheel.
#
# `dependencies` stays empty. When the workflow grows a check script and a target app, the app's
# substrate is declared in the app's own project — never here.

[project]
name = "agentic-development-workflow"
version = "0.1.0"
description = "Tooling for a spec-driven agentic development workflow."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
