# THE META LAYER'S OWN TEST ENVIRONMENT — one hat, and no other (T15).
#
# Its only job: the toolchain that runs the ~390 tests under `.claude/tools/`, which test
# gate.py / accept.py / red_check.py / the hooks themselves. They ship nowhere and they must
# keep passing in a tree with no `src/` at all.
#
# What must never be added here:
#   * a `[build-system]` — this repository is not a distributable package. The plugin ships by
#     location (`.claude/` IS the plugin root, released by `git subtree split`), and a
#     build-system whose `src/<pkg>/` is absent makes uv hard-fail every command (T12b).
#   * a trial app's substrate (a web framework, a driver, a migration tool, testcontainers…).
#     A trialled change lives in a separate consumer project now (notes/21), so declaring its
#     dependencies here would make `pytest .claude/tools/` need a trial app to be present.
#   * the toolchain a CONSUMER needs. That one is correct where it is — in the consumer's own
#     pyproject.toml (`conventions` block D) — because gate.py runs
#     `sys.executable -m mypy|ruff|pytest` and those tools must see the app's code.
#
# The v3 definition of "green" (the pinned mypy/ruff/pytest config) lives inside gate.py: one
# definition, cited never restated (C7). Do not grow toolchain config here.
#
# Guarded, not merely asked (S4): `.claude/tools/test_plugin_packaging.py` fails on a
# `[build-system]`, a non-empty `dependencies`, `[project.scripts]`, or any substrate name.

[project]
name = "agentic-development-workflow"
version = "0.1.0"
description = "Tooling for a spec-driven agentic development workflow (v3)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
