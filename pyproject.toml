# Meta-layer environment only. The v2 generator package this file used to build was purged
# in T02 (recoverable from git history). The target app's own pyproject.toml is created by
# the change cycle when the first change lands, and the v3 toolchain config ("green") lives
# inside gate.py (planned, T04) — do not grow toolchain config here.

[project]
name = "agentic-development-workflow"
version = "0.1.0"
description = "Tooling for a spec-driven agentic development workflow (v3)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
